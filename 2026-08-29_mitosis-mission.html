<title>Mitosis Mission</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one centred column like a microscope slide; one question card at a time, big tap targets for phones. */
:root{
  --bg:#EEF2F5;        /* slide glass */
  --surface:#FFFFFF;
  --ink:#1B1D2E;
  --muted:#565B72;
  --line:#D5DCE4;
  --stain:#5B2A86;     /* hematoxylin purple */
  --stain-soft:#EFE6F8;
  --eosin:#C2185B;     /* eosin pink: chromosomes */
  --good:#1B7F3B; --good-soft:#E3F4E8;
  --bad:#C62828;  --bad-soft:#FCE6E6;
  --cell-fill:#FCE9F0; --cell-line:#D48AA6;
  --nuc-fill:#EDE3F7;  --nuc-line:#8E6BB5;
  --spindle:#7C8AA5;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131C;--surface:#1C1E2B;--ink:#F1F1F6;--muted:#A9ADC2;--line:#33374A;
  --stain:#C5A6F0;--stain-soft:#2C2540;--eosin:#FF7BA6;
  --good:#5AD184;--good-soft:#173524;--bad:#FF7A6E;--bad-soft:#3A1C1C;
  --cell-fill:#34202B;--cell-line:#B06586;--nuc-fill:#2E2645;--nuc-line:#A58BD0;--spindle:#8792AB;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131C;--surface:#1C1E2B;--ink:#F1F1F6;--muted:#A9ADC2;--line:#33374A;
  --stain:#C5A6F0;--stain-soft:#2C2540;--eosin:#FF7BA6;
  --good:#5AD184;--good-soft:#173524;--bad:#FF7A6E;--bad-soft:#3A1C1C;
  --cell-fill:#34202B;--cell-line:#B06586;--nuc-fill:#2E2645;--nuc-line:#A58BD0;--spindle:#8792AB;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:18px;line-height:1.5;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.4rem;font-weight:800;color:var(--stain)}
h2{font-size:1.45rem;font-weight:800}
p{margin:0}
.say{font-size:.85em;color:var(--muted);letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--stain);outline-offset:3px}
.btn{background:var(--stain);color:var(--surface);border:0;border-radius:14px;min-height:56px;padding:12px 22px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--stain);border:2px solid var(--stain)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Intro */
.badge-free{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .who{font-size:2rem;line-height:1;flex:none}
.bubble > p,.bubble > .ex{background:var(--stain-soft);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.bubble.rab > p{background:var(--cell-fill)}
.types{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.types li{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}

/* Progress */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem;color:var(--muted)}
.top b{color:var(--ink);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots span{height:8px;border-radius:4px;background:var(--line)}
.dots span.now{background:var(--stain)}
.dots span.ok{background:var(--good)}
.dots span.no{background:var(--bad)}

/* Question */
.tag{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--eosin);background:var(--cell-fill);border-radius:8px;padding:2px 10px}
.qtext{font-size:1.3rem;font-weight:700;line-height:1.4}
.term{border:2px dashed var(--nuc-line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.term .en{font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--stain);line-height:1.1}
.fig{background:var(--bg);border-radius:14px;padding:8px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:360px;height:auto;display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:var(--stain);color:var(--surface);font-family:var(--f-display)}
td.n{text-align:right}
tr.total td{font-weight:700}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:60px;padding:10px 14px;width:100%}
.opt:hover:not([disabled]){border-color:var(--stain)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--stain-soft);color:var(--stain);font-family:var(--f-display);font-weight:800}
.opt .body{display:flex;flex-direction:column;min-width:0}
.opt .body .main{font-weight:700;font-size:1.1rem}
.opt .mark{margin-left:auto;font-size:1.4rem;flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}

.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pic{flex-direction:column;align-items:stretch;padding:8px;gap:6px;min-width:0}
.pic svg{width:100%;height:auto;display:block}
.pic .cap{display:flex;gap:8px;align-items:center}
.pic .name{font-weight:700;font-size:.95rem}

/* Order */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;width:100%;background:transparent;text-align:left}
.slot.filled{border-style:solid;border-color:var(--stain);background:var(--stain-soft)}
.slot .num{font-family:var(--f-display);font-weight:800;width:28px;color:var(--stain)}
.slot.right{border-color:var(--good);background:var(--good-soft)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--stain);background:var(--surface);color:var(--stain);border-radius:999px;padding:8px 16px;min-height:48px;font-weight:700}
.chip[hidden]{display:none}
.hint{font-size:.95rem;color:var(--muted)}

/* Feedback */
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.ex{display:flex;flex-direction:column;gap:8px}
.ex .note{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.95rem}
.src{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.next-row{display:flex;justify-content:flex-end}

/* Results */
.score{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;color:var(--stain);font-variant-numeric:tabular-nums}
.stars{font-size:2rem;letter-spacing:4px}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skill{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.skill b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.skill span{font-size:.85rem;color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details .ex{margin-top:10px}
#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:10}
@media (max-width:420px){ h1{font-size:2rem} .qtext{font-size:1.18rem} .skills{grid-template-columns:1fr 1fr 1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* SVG cell drawings */
.c-cell{fill:var(--cell-fill);stroke:var(--cell-line);stroke-width:3}
.c-nuc{fill:var(--nuc-fill);stroke:var(--nuc-line);stroke-width:2.5}
.c-nuc.broken{fill:none;stroke-dasharray:6 7}
.c-chr{fill:none;stroke:var(--eosin);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.c-cm{fill:var(--stain)}
.c-tin{fill:none;stroke:var(--eosin);stroke-width:2;stroke-linecap:round;opacity:.75}
.c-sp{fill:none;stroke:var(--spindle);stroke-width:1.4;opacity:.8}
.c-ce{fill:var(--stain)}
.c-nl{fill:var(--stain);opacity:.7}
</style>

<canvas id="confetti" hidden></canvas>
<main class="wrap" id="app"></main>

<script>
/* ---------- Words: English, say it ---------- */
const W = {
  mitosis:['mitosis','my-TOH-sis'],
  interphase:['interphase','IN-ter-faze'],
  prophase:['prophase','PRO-faze'],
  metaphase:['metaphase','MET-uh-faze'],
  anaphase:['anaphase','AN-uh-faze'],
  telophase:['telophase','TEL-oh-faze'],
  cytokinesis:['cytokinesis','sy-toh-kih-NEE-sis'],
  chromosome:['chromosome','KROH-muh-sohm'],
  daughter:['daughter cells','DAW-ter sells'],
  parent:['parent cell','PAIR-ent sell'],
  sister:['sister chromatids','SIS-ter KROH-muh-tids'],
  centromere:['centromere','SEN-truh-meer'],
  centriole:['centriole','SEN-tree-ohl'],
  spindle:['spindle fibres','SPIN-dul FY-bers'],
  chromatin:['chromatin','KROH-muh-tin'],
  stem:['stem cells','STEM sells'],
  cancer:['cancer','KAN-ser'],
  nucleus:['nucleus','NOO-klee-us'],
  cellplate:['cell plate','SELL playt'],
  nucmem:['nuclear membrane','NOO-klee-er MEM-brain'],
  cellwall:['cell walls','SELL wallz']
};

/* ---------- Cell drawings (replace with Marianne's photos later) ---------- */
const X = (x,y,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r})"><path class="c-chr" d="M-7,-12 Q-1,0 -7,12 M7,-12 Q1,0 7,12"/><circle class="c-cm" r="3"/></g>`;
const V = (x,y,dir)=>`<g transform="translate(${x} ${y}) scale(${dir} 1)"><path class="c-chr" d="M12,-12 L1,0 L12,12"/><circle class="c-cm" cx="1" r="3"/></g>`;
const tin = (x,y)=>`<g transform="translate(${x} ${y})"><path class="c-tin" d="M-12,-8 q4,-6 8,0 t8,0 M-10,4 q4,6 8,0 t8,0 t6,-2 M-4,12 q3,-4 6,0"/></g>`;
const cent = (x,y)=>`<g transform="translate(${x} ${y})"><rect class="c-ce" x="-5" y="-2" width="10" height="4" rx="2"/><rect class="c-ce" x="-2" y="-5" width="4" height="10" rx="2"/></g>`;
function stage(name){
  const S = (inner)=>`<svg viewBox="0 0 240 160" role="img" aria-label="A cell in one stage of the cell cycle">${inner}</svg>`;
  const cell = `<ellipse class="c-cell" cx="120" cy="80" rx="104" ry="66"/>`;
  if(name==='interphase') return S(cell+`<circle class="c-nuc" cx="120" cy="80" r="38"/>${tin(108,72)}${tin(128,90)}${tin(132,66)}<circle class="c-nl" cx="112" cy="92" r="6"/>`);
  if(name==='prophase') return S(cell+`<circle class="c-nuc broken" cx="120" cy="80" r="42"/>${X(102,64,25)}${X(138,70,-35)}${X(110,98,70)}${X(140,100,10)}<path class="c-sp" d="M58,48 Q120,30 182,112 M58,48 Q110,70 182,112 M58,48 Q140,60 182,112"/>${cent(58,48)}${cent(182,112)}`);
  if(name==='metaphase'){ let s=''; const ys=[34,62,98,126]; ys.forEach(y=>{s+=`<path class="c-sp" d="M26,80 L113,${y} M214,80 L127,${y}"/>`}); ys.forEach(y=>{s+=`<g transform="translate(120 ${y}) scale(.8) translate(-120 ${-y})">${X(120,y,0)}</g>`}); return S(cell+s+cent(26,80)+cent(214,80)); }
  if(name==='anaphase'){ let s=`<ellipse class="c-cell" cx="120" cy="80" rx="112" ry="60"/>`; const ys=[46,68,92,114];
    ys.forEach(y=>{s+=`<path class="c-sp" d="M18,80 L68,${y} M222,80 L172,${y}"/>`}); s+=`<path class="c-sp" d="M18,80 L222,80 M18,80 Q120,60 222,80 M18,80 Q120,100 222,80"/>`;
    ys.forEach(y=>{s+=V(68,y,1)+V(172,y,-1)}); return S(s+cent(18,80)+cent(222,80)); }
  if(name==='telophase') return S(`<path class="c-cell" d="M120,46 C96,8 18,14 16,80 C18,146 96,152 120,114 C144,152 222,146 224,80 C222,14 144,8 120,46 Z"/><circle class="c-nuc broken" cx="68" cy="80" r="30"/><circle class="c-nuc broken" cx="172" cy="80" r="30"/>${tin(64,78)}${tin(168,78)}`);
}

/* ---------- Questions ---------- */
const Q = [
 {type:'mc',tag:'Word → Meaning',skill:'words',q:`What does this word mean?`,term:'mitosis',
  opts:[`The nucleus divides into two identical nuclei`,`The cytoplasm splits and one cell becomes two`,`The cell grows and copies its DNA`,`Cells divide out of control`],a:0,
  ex:`<p><b>Mitosis</b> = the <b>nucleus</b> divides. Each new nucleus gets the same, identical DNA.</p><div class="note">🧩 The wrong answers are other words: splitting the cytoplasm = <b>cytokinesis</b>. Growing + copying DNA = <b>interphase</b>. Out of control = <b>cancer</b>.</div>`,
  src:'Textbook Ch 5.1 · Word Bank #26'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the two new cells made when one cell divides</i>?`,
  opts:['daughter','parent','sister','stem'].map(k=>({w:k})),a:0,
  ex:`<p>One <b>parent cell</b> divides → two <b>daughter cells</b>. The daughters are identical to each other and to the parent, like identical twin sisters. 👯‍♀️</p><div class="note">⚠️ Careful: <b>sister chromatids</b> are two copies of a chromosome, not cells.</div>`,
  src:'Textbook Ch 5.1'},

 {type:'mc',tag:'Word Detective',skill:'words',q:`🔎 The word part <b>telo-</b> means <b>END</b>. So what is <b>telophase</b>?`,
  opts:[`The last stage of mitosis: two new nuclei form`,`The first stage of mitosis: chromosomes appear`,`The middle stage: chromosomes line up`,`The stage when chromatids are pulled apart`],a:0,
  ex:`<p><b>Telo-</b> = end, so <b>telophase</b> is the end stage. The chromosomes uncoil and two new nuclear membranes form.</p><div class="note">🧠 Memory trick for P-M-A-T:<br><b>P</b>ro = first · <b>M</b>eta = Middle · <b>A</b>na = Apart · <b>T</b>elo = the end<br><span class="say">(Only "telo = end" is the real Greek meaning. The others are memory tricks.)</span></div>`,
  src:'Textbook Ch 5.3'},

 {type:'mc',tag:'Picture ID',skill:'stages',q:`🔬 Look at this cell. Which stage is it in?`,fig:'metaphase',
  opts:['prophase','metaphase','anaphase','telophase'].map(k=>({w:k})),a:1,
  ex:`<p>The chromosomes are in <b>one straight line in the Middle</b> of the cell → <b>Metaphase</b>. Spindle fibres from each side hold every chromosome at its centromere.</p><div class="note">🍵 Like tea glasses lined up in one row across the middle of a tray.</div>`,
  src:'Textbook Ch 5.3 · Curriculum B2.2'},

 {type:'mc',tag:'Word Detective',skill:'words',q:`🔎 <b>cyto-</b> means <b>cell</b>. <b>-kinesis</b> means <b>movement</b>. So what is <b>cytokinesis</b>?`,
  opts:[`The cytoplasm splits and one cell becomes two`,`The nucleus divides`,`The DNA is copied`,`The chromosomes uncoil`],a:0,
  ex:`<p>You already know <b>cyto</b>plasm (the jelly inside a cell) and <b>kine</b>tic energy (energy of movement). <b>Cytokinesis</b> = the cell moves apart into two.</p><div class="note">1️⃣ Mitosis divides the <b>nucleus</b>. 2️⃣ Cytokinesis divides <b>everything else</b>.</div>`,
  src:'Textbook Ch 5.3 · Word Bank #31'},

 {type:'order',tag:'Put in Order',skill:'stages',q:`Tap the stages in the correct order, from first to last.`,
  items:['interphase','prophase','metaphase','anaphase','telophase','cytokinesis'],
  ex:`<p>Interphase → Prophase → Metaphase → Anaphase → Telophase → Cytokinesis</p><div class="note">☕ Memory sentence: <b>I P</b>our <b>M</b>ore <b>A</b>fghan <b>T</b>ea, <b>C</b>arefully!<br>I-P-M-A-T-C</div>`,
  src:'Unit 1 Review Test, Q2'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>two identical copies of a chromosome, joined together in the middle</i>?`,
  opts:['sister','centromere','spindle','chromatin'].map(k=>({w:k})),a:0,
  ex:`<p>Before mitosis, each chromosome is copied. The two copies are <b>sister chromatids</b>. Together they make the X shape.</p><div class="note">The spot that joins them is the <b>centromere</b>. You will see that word again soon!</div>`,
  src:'Textbook Ch 7.3'},

 {type:'mc',tag:'Picture ID',skill:'stages',q:`🔬 Look at this cell. Which stage is it in?`,fig:'anaphase',
  opts:['metaphase','anaphase','telophase','interphase'].map(k=>({w:k})),a:1,
  ex:`<p>The chromatids are <b>moving Apart</b> to opposite ends (poles) of the cell. They make V shapes because the spindle fibres pull them by the centromere → <b>Anaphase</b>.</p><div class="note">🪣 Like pulling a bucket up from a well: the rope gets shorter and pulls the bucket up. The textbook says it is like reeling in a fish.</div>`,
  src:'Textbook Ch 5.3 · Curriculum B2.2'},

 {type:'mc',tag:'Which is NOT?',skill:'stages',q:`Which one does <b>NOT</b> happen during <b>prophase</b>?`,
  opts:[`The chromosomes line up in the middle of the cell`,`Chromatin coils up and chromosomes become visible`,`The nuclear membrane breaks down`,`Spindle fibres start to form`],a:0,
  ex:`<p>Lining up in the middle happens in <b>metaphase</b>, not prophase.</p><div class="note">In <b>prophase</b> (pro = first): chromosomes appear, the nuclear membrane breaks down, and the spindle starts to form. It is the <b>longest</b> stage of mitosis.</div>`,
  src:'Textbook Ch 5.3'},

 {type:'mc',tag:'Mitosis Math',skill:'math',q:`➗ A human skin cell has <b>46 chromosomes</b>. It divides by mitosis. How many chromosomes does <b>EACH</b> daughter cell have?`,
  opts:['23','46','92','184'],a:1,
  ex:`<p>Mitosis makes <b>identical</b> cells, so each daughter cell gets the same number: <b>46</b>.</p><div class="note">46 chromosomes → copied (each one now has 2 sister chromatids) → the chromatids split apart → 46 in each new cell.<br>23 is for egg and sperm cells. That is a different kind of cell division you learn in Grade 11.</div>`,
  src:'Textbook Ch 5.1'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the longest stage of the cell cycle, when the cell grows and copies its DNA</i>?`,
  opts:['interphase','prophase','telophase','cytokinesis'].map(k=>({w:k})),a:0,
  ex:`<p><b>Inter-</b> means <b>between</b> (like <i>inter</i>national = between countries). Interphase is the time <b>between</b> divisions. A cell spends most of its life here.</p><div class="note">⚠️ Tricky! Interphase is the longest stage of the whole <b>cell cycle</b>. Prophase is the longest stage of <b>mitosis</b>.</div>`,
  src:'Textbook Ch 5.2 · Word Bank #25'},

 {type:'mc',tag:'Word → Meaning',skill:'words',q:`What does this word mean?`,term:'chromatin',
  opts:[`DNA that is loose and uncoiled, like a tangle of thread`,`DNA coiled up tightly into an X shape`,`The spot where two chromatids are joined`,`The fibres that pull chromosomes apart`],a:0,
  ex:`<p><b>Chromatin</b> is loose DNA. Before the cell divides, the chromatin coils up tightly into <b>chromosomes</b> so it is easy to move.</p><div class="note">🧶 Like wool for carpet weaving: a loose pile of thread is chromatin. Wound tightly into a ball, it is a chromosome.</div>`,
  src:'Textbook Ch 7.3 · Unit 1 Review Test (Communication Q2)'},

 {type:'pic',tag:'Pick the Picture',skill:'stages',q:`👆 Tap the picture that shows <b>TELOPHASE</b>.`,
  pics:['prophase','metaphase','anaphase','telophase'],a:3,
  ex:`<p>In <b>telophase</b> (telo = end) there are <b>two new nuclei</b>, one at each end, and the cell starts to pinch in the middle.</p>`,
  src:'Textbook Ch 5.3 · Curriculum B2.2'},

 {type:'mc',tag:'Odd One Out',skill:'stages',q:`Three of these are phases of <b>mitosis</b>. Which one is the <b>odd one out</b>?`,
  opts:['prophase','anaphase','interphase','metaphase'].map(k=>({w:k})),a:2,
  ex:`<p><b>Interphase</b> is not part of mitosis. It is the time <b>between</b> divisions.</p><div class="note">Mitosis has only 4 phases: <b>P-M-A-T</b>.</div>`,
  src:'Textbook Ch 5.2–5.3'},

 {type:'mc',tag:'Mitosis Math',skill:'math',q:`➗ Farida looks at an onion root tip under a microscope. She counts 200 cells. The whole cell cycle takes <b>24 hours</b>. About how long does a cell spend in <b>prophase</b>?`,
  table:[['Interphase',160],['Prophase',20],['Metaphase',8],['Anaphase',4],['Telophase',8]],
  opts:['2.4 hours','20 hours','10 hours','0.1 hours'],a:0,
  ex:`<p>More cells in a stage = a <b>longer</b> stage.</p><div class="note"><b>Step 1:</b> fraction in prophase = 20 ÷ 200 = 0.10 (10%)<br><b>Step 2:</b> time = 0.10 × 24 hours = <b>2.4 hours</b> (= 144 minutes)</div><div class="note">❌ 20 hours used the number of cells. ❌ 10 hours used the percent. ❌ 0.1 hours forgot to multiply by 24.</div>`,
  src:'Curriculum B2.2 (observing stages under a microscope)'},

 {type:'mc',tag:'Fill the Gap',skill:'words',q:`During anaphase, the <b>______</b> get shorter and pull the sister chromatids to opposite ends of the cell.`,
  opts:['spindle','centromere','cellwall','nucmem'].map(k=>({w:k})),a:0,
  ex:`<p><b>Spindle fibres</b> are like ropes. They get shorter and pull the chromatids apart. 🪢</p><div class="note">The nuclear membrane has already broken down by this time, and animal cells do not have cell walls.</div>`,
  src:'Textbook Ch 5.3'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the spot in the middle of a chromosome that holds the two sister chromatids together</i>?`,
  opts:['centromere','centriole','chromatin','nucleus'].map(k=>({w:k})),a:0,
  ex:`<p><b>Centro-</b> = centre and <b>-mere</b> = part. The <b>centromere</b> is the centre part of the chromosome.</p><div class="note">⚠️ These two look alike! <b>Centromere</b> = the middle of a chromosome. <b>Centriole</b> = small parts at the ends of an animal cell that help make the spindle.</div>`,
  src:'Textbook Ch 5.3 · Ch 7.3'},

 {type:'mc',tag:'Plant vs Animal',skill:'stages',q:`🌱 How is cytokinesis different in <b>plant</b> cells?`,
  opts:[`A cell plate forms in the middle and becomes a new cell wall`,`The cell membrane pinches inward in the middle`,`Plant cells do not do cytokinesis`,`Plant cells skip mitosis and only do cytokinesis`],a:0,
  ex:`<p>Plant cells have a stiff <b>cell wall</b>, so they cannot pinch in. Instead, they build a <b>cell plate</b> down the middle, which becomes a new wall. 🧱</p><div class="note">Animal cells: the membrane <b>pinches</b> inward. Plant cells: a new <b>wall</b> is built, like building a wall to make one room into two.</div>`,
  src:'Textbook Ch 5.3'},

 {type:'mc',tag:'Mitosis Math',skill:'math',q:`➗ One cell in a wheat root tip divides by mitosis. Then every new cell divides again, and again. After <b>5 rounds</b> of division, how many cells are there?`,
  opts:['10','25','32','64'],a:2,
  ex:`<p>Each round, the number of cells <b>doubles</b>:</p><div class="note">1 → 2 → 4 → 8 → 16 → <b>32</b><br>That is 2 × 2 × 2 × 2 × 2 = 2⁵ = 32</div><div class="note">❌ 10 added 2 each time instead of doubling. ❌ 64 is 6 rounds.</div>`,
  src:'Textbook Ch 5.1 · Ch 5.4 (plant growth)'},

 {type:'mc',tag:'Word → Meaning',skill:'words',q:`What does this word mean?`,term:'cancer',
  opts:[`A disease where the cell cycle is not controlled, so cells divide too fast`,`A disease where cells stop dividing forever`,`The stage when DNA is copied`,`When a cell becomes a specialized cell`],a:0,
  ex:`<p><b>Cancer</b> happens when a cell's DNA is damaged (for example by radiation or toxic chemicals). The cell cycle is no longer controlled, and cells divide much faster than normal. They can make a lump called a <b>tumour</b>.</p><div class="note">Something that can cause cancer is a <b>carcinogen</b>, for example tobacco smoke or UV rays.</div>`,
  src:'Textbook Ch 5.4 · Unit 1 Review Test (Communication Q1)'}
];

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s);
const wordHTML = (k,cls='')=>{const w=W[k];return `<span class="main ${cls}">${w[0]}</span><span class="say">🔊 ${w[1]}</span>`};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LET = ['A','B','C','D'];
const PRAISE = ['Excellent! 🎉','Well done! 🌟','Baa-rilliant! 🐑','Correct! Great memory 💜','Yes! You are a cell expert 🔬'];
const OOPS = ['I mixed that one up too! Let\'s see why…','Almost! These words are tricky.','Good try! Sheep will explain.','Oops! I learn best from mistakes.'];

const state = {i:0,score:0,res:[],order:[],locked:false,skill:{words:[0,0],stages:[0,0],math:[0,0]}};
const app = $('#app');

/* ---------- Screens ---------- */
function intro(){
  app.innerHTML = `
  <section class="card">
    <h1>Mitosis Mission 🔬</h1>
    <div class="badge-free">✅ This quiz is NOT graded. It is NOT recorded. It does NOT affect your mark. It is just for practice!</div>
    <div class="chat">
      <div class="bubble"><span class="who" aria-hidden="true">🐑</span><p><b>Sheep:</b> Salaam! Today we practise <b>mitosis</b>: how one cell becomes two. There are 20 questions.</p></div>
      <div class="bubble rab"><span class="who" aria-hidden="true">🐰</span><p><b>Rabbit:</b> So many new words! 😅 But look, every new word shows how to say it. And after every question, Sheep explains the answer.</p></div>
    </div>
    <ul class="types" aria-label="Question types">
      <li>📖 Word → Meaning</li><li>🔤 Meaning → Word</li><li>🔎 Word Detective</li><li>🔬 Picture ID</li><li>🔢 Put in Order</li><li>🚫 Which is NOT?</li><li>➗ Mitosis Math</li>
    </ul>
    <p class="hint">Tip: on a computer you can press keys 1–4 to answer and Enter for the next question.</p>
    <div class="row"><button class="btn" id="start">Start ▶</button></div>
  </section>`;
  $('#start').onclick = ()=>{reset();show()};
  $('#start').focus();
}
function reset(){state.i=0;state.score=0;state.res=[];state.skill={words:[0,0],stages:[0,0],math:[0,0]}}

function header(){
  const dots = Q.map((_,k)=>`<span class="${state.res[k]===true?'ok':state.res[k]===false?'no':k===state.i?'now':''}"></span>`).join('');
  return `<div class="top"><span>Question <b>${state.i+1}</b> of 20</span><span>Score: <b>${state.score}</b></span></div><div class="dots" aria-hidden="true">${dots}</div>`;
}

function show(){
  state.locked=false;
  const q = Q[state.i];
  let body = '';
  if(q.term){const w=W[q.term];body+=`<div class="term"><span class="en">${w[0]}</span><span class="say">🔊 ${w[1]}</span></div>`}
  if(q.fig) body+=`<div class="fig">${stage(q.fig)}</div>`;
  if(q.table){const tot=q.table.reduce((s,r)=>s+r[1],0);body+=`<div class="tbl-wrap"><table><thead><tr><th>Stage</th><th style="text-align:right">Number of cells</th></tr></thead><tbody>${q.table.map(r=>`<tr><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')}<tr class="total"><td>Total</td><td class="n">${tot}</td></tr></tbody></table></div>`}

  if(q.type==='mc'){
    const order = shuffle(q.opts.map((o,k)=>k));
    q._order = order;
    body += `<div class="opts">${order.map((k,n)=>{const o=q.opts[k];const inner=typeof o==='string'?`<span class="main">${o}</span>`:wordHTML(o.w);return `<button class="opt" data-k="${k}"><span class="k">${LET[n]}</span><span class="body">${inner}</span><span class="mark"></span></button>`}).join('')}</div>`;
  } else if(q.type==='pic'){
    const order = shuffle(q.pics.map((p,k)=>k)); q._order=order;
    body += `<div class="pics">${order.map((k,n)=>`<button class="opt pic" data-k="${k}" aria-label="Picture ${LET[n]}">${stage(q.pics[k])}<span class="cap"><span class="k">${LET[n]}</span><span class="name" hidden>${W[q.pics[k]][0]}</span><span class="mark"></span></span></button>`).join('')}</div>`;
  } else if(q.type==='order'){
    state.order=[];
    const mix = shuffle(q.items);
    body += `<div class="slots">${q.items.map((_,n)=>`<button class="slot" data-n="${n}" aria-label="Place ${n+1}"><span class="num">${n+1}</span><span class="val hint">tap a word below</span></button>`).join('')}</div>
      <div class="chips">${mix.map(k=>`<button class="chip" data-w="${k}">${W[k][0]}</button>`).join('')}</div>
      <p class="hint">Tap a filled box to take the word back.</p>
      <div class="row"><button class="btn" id="check" disabled>Check my order</button></div>`;
  }

  app.innerHTML = `${header()}<section class="card" aria-live="polite"><span class="tag">${q.tag}</span><p class="qtext">${q.q}</p>${body}<div id="fb"></div></section>`;

  if(q.type==='mc'||q.type==='pic') app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(q.type==='order') wireOrder(q);
  window.scrollTo({top:0});
}

function wireOrder(q){
  const render=()=>{
    app.querySelectorAll('.slot').forEach((s,n)=>{const k=state.order[n];s.classList.toggle('filled',!!k);s.querySelector('.val').outerHTML = k?`<span class="val"><b>${W[k][0]}</b></span>`:`<span class="val hint">tap a word below</span>`});
    app.querySelectorAll('.chip').forEach(c=>c.hidden=state.order.includes(c.dataset.w));
    $('#check').disabled = state.order.length!==q.items.length;
  };
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(state.locked)return;state.order.push(c.dataset.w);render()});
  app.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(state.locked)return;const n=+s.dataset.n;if(n<state.order.length){state.order.splice(n,1);render()}});
  $('#check').onclick=()=>{
    state.locked=true;
    let ok=true;
    app.querySelectorAll('.slot').forEach((s,n)=>{const r=state.order[n]===q.items[n];if(!r)ok=false;s.classList.add(r?'right':'wrong');s.insertAdjacentHTML('beforeend',`<span class="mark" style="margin-left:auto">${r?'✅':'❌'}</span>`)});
    $('#check').remove();
    finish(ok);
  };
}

function answer(k){
  if(state.locked) return; state.locked=true;
  const q=Q[state.i]; const ok = k===q.a;
  app.querySelectorAll('.opt').forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.a){b.classList.add('right');b.querySelector('.mark').textContent='✅'}
    else if(bk===k){b.classList.add('wrong');b.querySelector('.mark').textContent='❌'}
    else b.classList.add('dim');
    const nm=b.querySelector('.name'); if(nm) nm.hidden=false;
  });
  finish(ok);
}

function correctText(q){
  if(q.type==='order') return q.items.map(k=>W[k][0]).join(' → ');
  if(q.type==='pic') return W[q.pics[q.a]][0];
  const o=q.opts[q.a]; return typeof o==='string'?o:W[o.w][0];
}

function finish(ok){
  const q=Q[state.i];
  state.res[state.i]=ok; if(ok) state.score++;
  state.skill[q.skill][1]++; if(ok) state.skill[q.skill][0]++;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const last = state.i===Q.length-1;
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">
    <p class="verdict">${ok?pick(PRAISE):'Not quite ❌'}</p>
    ${ok?'':`<div class="bubble rab"><span class="who" aria-hidden="true">🐰</span><p><b>Rabbit:</b> ${pick(OOPS)}</p></div><p><b>Correct answer:</b> ${correctText(q)}</p>`}
    <div class="bubble"><span class="who" aria-hidden="true">🐑</span><div class="ex"><p><b>Sheep explains:</b></p>${q.ex}</div></div>
    <p class="src">📚 From: ${q.src}</p>
    <div class="next-row"><button class="btn" id="next">${last?'See my score 🎉':'Next ▶'}</button></div>
  </div>`;
  app.querySelector('.top span:last-child b').textContent = state.score;
  const d=app.querySelectorAll('.dots span')[state.i]; d.className = ok?'ok':'no';
  $('#next').onclick=()=>{ if(last) results(); else {state.i++;show()} };
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}

function results(){
  const s=state.score;
  const stars = s>=18?'⭐⭐⭐':s>=13?'⭐⭐☆':s>=8?'⭐☆☆':'☆☆☆';
  const msg = s>=18?'Excellent! You really know your mitosis words. 🏆':s>=13?'Great work! Look at the questions below to make it even better. 💪':s>=8?'Good start! Read the explanations below and try again. 🌱':'These are hard new words. Read the explanations below and try again. You can do it! 💜';
  const sk=(k,label)=>`<div class="skill"><b>${state.skill[k][0]}/${state.skill[k][1]}</b><span>${label}</span></div>`;
  const missed = Q.map((q,k)=>({q,k})).filter(o=>state.res[o.k]===false);
  app.innerHTML = `<section class="card" style="align-items:center;text-align:center">
    <h2>Mission complete!</h2>
    <div class="score">${s}/20</div>
    <div class="stars" aria-label="${stars.split('⭐').length-1} stars">${stars}</div>
    <div class="bubble" style="text-align:left"><span class="who" aria-hidden="true">🐑</span><p><b>Sheep:</b> ${msg}</p></div>
    <div class="skills" style="width:100%">${sk('words','📖 Words')}${sk('stages','🔬 Stages')}${sk('math','➗ Math')}</div>
    <div class="badge-free" style="width:100%">✅ Remember: this is NOT graded, NOT recorded, and does NOT affect your mark.</div>
  </section>
  ${missed.length?`<section class="card"><h2>Look at these again 👀</h2>${missed.map(({q,k})=>`<details><summary>Q${k+1}. ${q.tag}: ${correctText(q)}</summary><div class="ex"><p class="hint">${q.q}</p>${q.ex}</div></details>`).join('')}</section>`:`<section class="card"><p>🐰 <b>Rabbit:</b> 20 out of 20! Wow! Can you teach me? 😄</p></section>`}
  <div class="row" style="justify-content:center"><button class="btn" id="again">Try again 🔁</button></div>`;
  $('#again').onclick=()=>{reset();show()};
  if(s>=8) confetti(s>=18?260:140);
  window.scrollTo({top:0});
}

/* ---------- Confetti (no internet needed) ---------- */
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'); cv.hidden=false; const cx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--stain','--eosin','--good','--nuc-line','--cell-line'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){cx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(++t<260) requestAnimationFrame(f); else {cx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})();
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  const n=['1','2','3','4'].indexOf(e.key)>-1?+e.key-1:['a','b','c','d'].indexOf(e.key.toLowerCase());
  const opts=app.querySelectorAll('.opt');
  if(n>-1 && opts[n] && !state.locked){opts[n].click();return}
  if((e.key==='Enter'||e.key==='ArrowRight') && $('#next')){e.preventDefault();$('#next').click()}
});

intro();
</script>
