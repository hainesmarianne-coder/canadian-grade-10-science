<meta charset="utf-8">
<title>Cell Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one centred column, one question card at a time, big tap targets for phones.
   Palette: Badakhshan lapis lazuli blue + Herat saffron, on a warm stone ground. */
:root{
  --bg:#F1F0EC;        /* stone */
  --surface:#FFFFFF;
  --ink:#191E2C;
  --muted:#545B6E;
  --line:#D8D6CF;
  --lapis:#1E3A8A;     /* lapis lazuli: main colour */
  --lapis-soft:#E3E9F8;
  --saffron:#A84E06;   /* saffron: accent */
  --saffron-soft:#FCEEDB;
  --good:#1B7F3B; --good-soft:#E3F4E8;
  --bad:#C62828;  --bad-soft:#FCE6E6;
  /* cell drawings */
  --cyto:#EAF0FB; --memb:#1E3A8A;
  --wall:#7A5A26; --wall-soft:#EADCC0; --caps:#F6EEDC;
  --dna:#C2410C; --ribo:#3A4258;
  --nuc-fill:#FCEEDB; --nuc-line:#B4570A;
  --mito:#C2541B; --mito-fill:#FBE0CF;
  --chloro:#2E7D3E; --chloro-fill:#BFE3C4;
  --vac:#CFE0F4; --vac-line:#7E9CC8;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131C;--surface:#1A1F2C;--ink:#EEF0F6;--muted:#A6ADC0;--line:#313849;
  --lapis:#A3B8F5;--lapis-soft:#1F2A47;--saffron:#F4B860;--saffron-soft:#3A2C17;
  --good:#5AD184;--good-soft:#173524;--bad:#FF7A6E;--bad-soft:#3A1C1C;
  --cyto:#1E2740;--memb:#A3B8F5;--wall:#C9A46A;--wall-soft:#3A3020;--caps:#2C2A22;
  --dna:#FF9A5C;--ribo:#C9CEDB;--nuc-fill:#3A2C17;--nuc-line:#F4B860;
  --mito:#F0905A;--mito-fill:#43281A;--chloro:#6CCB7C;--chloro-fill:#1F3D26;--vac:#22385A;--vac-line:#6F8FC2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131C;--surface:#1A1F2C;--ink:#EEF0F6;--muted:#A6ADC0;--line:#313849;
  --lapis:#A3B8F5;--lapis-soft:#1F2A47;--saffron:#F4B860;--saffron-soft:#3A2C17;
  --good:#5AD184;--good-soft:#173524;--bad:#FF7A6E;--bad-soft:#3A1C1C;
  --cyto:#1E2740;--memb:#A3B8F5;--wall:#C9A46A;--wall-soft:#3A3020;--caps:#2C2A22;
  --dna:#FF9A5C;--ribo:#C9CEDB;--nuc-fill:#3A2C17;--nuc-line:#F4B860;
  --mito:#F0905A;--mito-fill:#43281A;--chloro:#6CCB7C;--chloro-fill:#1F3D26;--vac:#22385A;--vac-line:#6F8FC2;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:18px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.4rem;font-weight:800;color:var(--lapis)}
h2{font-size:1.45rem;font-weight:800}
p{margin:0}
.say{font-size:.85em;color:var(--muted);letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.btn{background:var(--lapis);color:var(--surface);border:0;border-radius:14px;min-height:56px;padding:12px 22px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Intro */
.badge-free{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .who{font-size:2rem;line-height:1;flex:none}
.bubble > p,.bubble > .ex{background:var(--lapis-soft);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.bubble.rab > p{background:var(--saffron-soft)}
.types{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.types li{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}

/* Progress */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem;color:var(--muted)}
.top b{color:var(--ink);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots span{height:8px;border-radius:4px;background:var(--line)}
.dots span.now{background:var(--saffron)}
.dots span.ok{background:var(--good)}
.dots span.no{background:var(--bad)}

/* Question */
.tag{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--saffron);background:var(--saffron-soft);border-radius:8px;padding:2px 10px}
.qtext{font-size:1.3rem;font-weight:700;line-height:1.4}
.term{border:2px dashed var(--nuc-line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.term .en{font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--lapis);line-height:1.1}
.fig{background:var(--bg);border-radius:14px;padding:8px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:360px;height:auto;display:block}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:60px;padding:10px 14px;width:100%}
.opt:hover:not([disabled]){border-color:var(--lapis)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--lapis-soft);color:var(--lapis);font-family:var(--f-display);font-weight:800}
.opt .body{display:flex;flex-direction:column;min-width:0}
.opt .body .main{font-weight:700;font-size:1.1rem}
.opt .mark{margin-left:auto;font-size:1.4rem;flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.opts.tf{flex-direction:row}
.opts.tf .opt{justify-content:center}

.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pic{flex-direction:column;align-items:stretch;padding:8px;gap:6px;min-width:0}
.pic svg{width:100%;height:auto;display:block}
.pic .cap{display:flex;gap:8px;align-items:center}
.pic .name{font-weight:700;font-size:.95rem}

/* Order */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;width:100%;background:transparent;text-align:left}
.slot.filled{border-style:solid;border-color:var(--lapis);background:var(--lapis-soft)}
.slot .num{font-family:var(--f-display);font-weight:800;width:auto;min-width:28px;color:var(--lapis)}
.slot.right{border-color:var(--good);background:var(--good-soft)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--lapis);background:var(--surface);color:var(--lapis);border-radius:999px;padding:8px 16px;min-height:48px;font-weight:700}
.hint{font-size:.95rem;color:var(--muted)}

/* Sort */
.sort{display:flex;flex-direction:column;gap:10px}
.srow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.srow .lab{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.srow .lab b{font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:.92rem;padding:4px}
.seg button.on{border-color:var(--lapis);background:var(--lapis-soft);color:var(--lapis)}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow .fix{font-size:.95rem;font-weight:700}

/* Feedback */
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.ex{display:flex;flex-direction:column;gap:8px}
.ex .note{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.95rem}
.src{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.next-row{display:flex;justify-content:flex-end}

/* Results */
.score{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;color:var(--lapis);font-variant-numeric:tabular-nums}
.stars{font-size:2rem;letter-spacing:4px}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skill{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.skill b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.skill span{font-size:.85rem;color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details .ex{margin-top:10px}
#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:10}
@media (max-width:420px){ h1{font-size:2rem} .qtext{font-size:1.18rem} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* SVG cell drawings */
.d-memb{fill:var(--cyto);stroke:var(--memb);stroke-width:2.5}
.d-wall{fill:var(--wall-soft);stroke:var(--wall);stroke-width:5}
.d-caps{fill:var(--caps);stroke:var(--wall);stroke-width:1.5;stroke-dasharray:4 4}
.d-dna{fill:none;stroke:var(--dna);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.d-ribo{fill:var(--ribo)}
.d-nuc{fill:var(--nuc-fill);stroke:var(--nuc-line);stroke-width:2.5}
.d-nl{fill:var(--nuc-line)}
.d-mito{fill:var(--mito-fill);stroke:var(--mito);stroke-width:2.5}
.d-cris{fill:none;stroke:var(--mito);stroke-width:2;stroke-linejoin:round}
.d-chl{fill:var(--chloro-fill);stroke:var(--chloro);stroke-width:2}
.d-vac{fill:var(--vac);stroke:var(--vac-line);stroke-width:2}
.d-hair{fill:none;stroke:var(--wall);stroke-width:2;stroke-linecap:round}
.d-arrow{fill:none;stroke:var(--saffron);stroke-width:4;stroke-linecap:round}
.d-head{fill:var(--saffron)}
</style>

<canvas id="confetti" hidden></canvas>
<main class="wrap" id="app"></main>

<script>
/* ---------- Words: English, say it ---------- */
const W = {
  prokaryote:['prokaryote','pro-KAIR-ee-oht'],
  eukaryote:['eukaryote','yoo-KAIR-ee-oht'],
  organelle:['organelle','or-guh-NEL'],
  nucleus:['nucleus','NOO-klee-us'],
  nucleoid:['nucleoid','NOO-klee-oyd'],
  nucleolus:['nucleolus','noo-KLEE-uh-lus'],
  plasmid:['plasmid','PLAZ-mid'],
  flagellum:['flagellum','fluh-JEL-um'],
  pili:['pili','PY-ly'],
  capsule:['capsule','KAP-sool'],
  membrane:['cell membrane','SELL MEM-brain'],
  wall:['cell wall','SELL wawl'],
  cytoplasm:['cytoplasm','SY-toh-plaz-um'],
  ribosome:['ribosomes','RY-buh-sohmz'],
  mito:['mitochondria','my-toh-KON-dree-uh'],
  chloro:['chloroplasts','KLOR-uh-plasts'],
  vacuole:['vacuole','VAK-yoo-ohl'],
  golgi:['Golgi apparatus','GOHL-jee ap-uh-RAT-us'],
  perm:['selectively permeable','sih-LEK-tiv-lee PER-mee-uh-bul'],
  endo:['endosymbiotic theory','en-doh-sim-by-OT-ik THEER-ee'],
  bacterium:['🦠 a bacterium','bak-TEER-ee-um'],
  animal:['🧍‍♀️ a human (animal) cell','AN-ih-mul sell'],
  plant:['🌿 a plant cell','PLANT sell'],
  pcell:['prokaryotic cell','pro-kair-ee-OT-ik sell'],
  acell:['animal cell','AN-ih-mul sell'],
  plcell:['plant cell','PLANT sell'],
  mitoc:['mitochondrion','my-toh-KON-dree-un']
};

/* ---------- Cell drawings ---------- */
const dots = pts => pts.map(([x,y])=>`<circle class="d-ribo" cx="${x}" cy="${y}" r="2.3"/>`).join('');
function cris(cx,cy,w,h,n){ // zig-zag inner membrane of a mitochondrion
  let d=`M${cx-w/2},${cy}`; const s=w/n;
  for(let i=0;i<n;i++){ const x=cx-w/2+s*i; d+=` L${x+s/2},${cy+(i%2?h:-h)} L${x+s},${cy}`; }
  return `<path class="d-cris" d="${d}"/>`;
}
function mitoSmall(x,y,r){return `<g transform="translate(${x} ${y}) rotate(${r})"><ellipse class="d-mito" rx="15" ry="8"/>${cris(0,0,22,4.5,5)}</g>`}
function cell(name,arrow){
  const S = (inner,label)=>`<svg viewBox="0 0 240 160" role="img" aria-label="${label}">${inner}</svg>`;
  if(name==='pcell') return S(
    `<path class="d-hair" d="M70,36 L64,24 M110,36 L110,22 M150,36 L156,24 M80,124 L74,136 M140,124 L146,136"/>
     <path class="d-hair" d="M198,80 q7,-12 14,0 t14,0 t13,0" style="stroke-width:2.5"/>
     <rect class="d-caps" x="18" y="36" width="180" height="88" rx="44"/>
     <rect class="d-wall" x="26" y="44" width="164" height="72" rx="36" style="stroke-width:4"/>
     <rect class="d-memb" x="33" y="51" width="150" height="58" rx="29"/>
     <path class="d-dna" d="M78,80 C80,62 104,60 112,70 C120,80 108,94 96,90 C84,86 90,70 104,72 C122,74 130,92 116,98 C100,104 76,98 78,80 Z"/>
     <circle class="d-dna" cx="150" cy="68" r="5"/><circle class="d-dna" cx="156" cy="94" r="4"/>
     ${dots([[52,70],[60,94],[132,62],[138,100],[170,80],[46,84],[124,84]])}`,'A prokaryotic cell: capsule, cell wall, cell membrane, a loop of DNA, ribosomes and a flagellum');
  if(name==='acell') return S(
    `<path class="d-memb" d="M40,82 C36,40 92,22 128,28 C172,34 210,52 206,88 C202,126 160,140 118,136 C70,132 44,118 40,82Z"/>
     <circle class="d-nuc" cx="112" cy="84" r="26"/><circle class="d-nl" cx="118" cy="90" r="7"/>
     ${mitoSmall(168,68,-20)}${mitoSmall(72,112,25)}${mitoSmall(168,110,10)}
     ${dots([[70,60],[82,86],[150,48],[140,120],[190,90],[100,124],[60,92]])}`,'An animal cell: cell membrane, nucleus and mitochondria, with no cell wall');
  if(name==='plcell'){
    let a='';
    if(arrow) a=`<path class="d-arrow" d="M239,80 L216,80"/><polygon class="d-head" points="203,80 216,72 216,88"/>`;
    return S(
    `<rect class="d-wall" x="16" y="12" width="208" height="136" rx="8"/>
     <rect class="d-memb" x="38" y="26" width="164" height="108" rx="6"/>
     <rect class="d-vac" x="92" y="40" width="100" height="78" rx="22"/>
     <circle class="d-nuc" cx="62" cy="58" r="16"/><circle class="d-nl" cx="66" cy="62" r="5"/>
     <ellipse class="d-chl" cx="62" cy="96" rx="14" ry="7"/><ellipse class="d-chl" cx="64" cy="120" rx="14" ry="7"/>
     <ellipse class="d-chl" cx="122" cy="127" rx="12" ry="4.5"/><ellipse class="d-chl" cx="166" cy="127" rx="12" ry="4.5"/>
     ${dots([[84,34],[150,33],[48,80],[86,108],[196,60]])}${a}`,arrow?'A plant cell with an arrow pointing to the thin inner layer just inside the thick outer layer':'A plant cell: thick cell wall, cell membrane, large vacuole, chloroplasts and nucleus');
  }
  if(name==='mitoc') return S(
    `<ellipse class="d-mito" cx="120" cy="80" rx="96" ry="46"/>${cris(120,80,160,26,9)}`,'A mitochondrion: an oval with a folded inner membrane');
}

/* ---------- Questions ---------- */
const Q = [
 {type:'mc',tag:'Word Detective',skill:'words',term:'prokaryote',
  q:`🔎 <b>pro-</b> means <b>before</b>. <b>karyon</b> means <b>kernel</b> (the nut inside a shell). In biology, karyon means the <b>nucleus</b>. So what is a prokaryote?`,
  opts:[`A cell with NO nucleus, like a bacterium`,`A cell with a true nucleus, like your cells`,`A small part inside a cell with one special job`,`A cell that makes food from sunlight`],a:0,
  ex:`<p>pro + karyon = <b>"before the nucleus"</b>. A <b>prokaryote</b> has no nucleus. Its DNA is loose in the cytoplasm.</p><div class="note">🌰 Think of an almond. A <b>eukaryote</b> (eu- = true) keeps its DNA inside a "shell", like the kernel inside an almond. A prokaryote has no shell around its DNA.</div>`,
  src:'Textbook Ch 7.1 (p. 51)'},

 {type:'mc',tag:'Word → Meaning',skill:'words',q:`What does this word mean?`,term:'organelle',
  opts:[`A small structure inside a cell that does one specific job`,`The jelly-like fluid that fills the cell`,`The stiff outer layer of a plant cell`,`A group of similar cells working together`],a:0,
  ex:`<p>organ + <b>-elle</b> (suffix = small) = a <b>"little organ"</b>. Your heart is an organ of your body. A mitochondrion is an organelle of a cell.</p><div class="note">🏪 Like a big bazaar: many small shops, and each shop has its own job.</div><div class="note">🧩 The wrong answers are other words: jelly = <b>cytoplasm</b>. Stiff outer layer = <b>cell wall</b>. Group of cells = <b>tissue</b>.</div>`,
  src:'Textbook Ch 7.1 (p. 53)'},

 {type:'mc',tag:'Odd One Out',skill:'parts',q:`Three of these are found <b>only</b> in eukaryotic cells. Which one is found in <b>ALL</b> cells, even bacteria?`,
  opts:['ribosome','nucleus','mito','golgi'].map(k=>({w:k})),a:0,
  ex:`<p><b>Ribosomes</b> make proteins. Every cell needs proteins, so every cell has ribosomes. In a prokaryote, ribosomes are the <b>only</b> organelles.</p><div class="note">⚠️ Ribosomes are special in another way too: they have <b>no membrane</b> around them.</div>`,
  src:'Textbook Ch 7.1 (p. 53) · Ch 7.3 (p. 79)'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the area in a prokaryote where the big loop of DNA sits, with NO membrane around it</i>?`,
  opts:['nucleoid','nucleus','nucleolus','plasmid'].map(k=>({w:k})),a:0,
  ex:`<p>nucleus + <b>-oid</b> (suffix = like) = <b>"like a nucleus"</b>. It looks a little like a nucleus, but it has no membrane.</p><div class="note">⚠️ Four look-alike words!<br><b>nucleus</b> = the DNA "room" with a membrane (eukaryotes)<br><b>nucleolus</b> = a small spot inside the nucleus that makes ribosomes<br><b>plasmid</b> = an extra small loop of DNA in a prokaryote<br><b>nucleoid</b> = where a prokaryote's main DNA loop sits</div>`,
  src:'Textbook Ch 7.2 (p. 57) · Ch 7.3 (p. 71)'},

 {type:'mc',tag:'Fill the Gap',skill:'words',q:`Many bacteria swim by spinning a long, thin, tail-like <b>______</b>.`,
  opts:['flagellum','pili','capsule','plasmid'].map(k=>({w:k})),a:0,
  ex:`<p>A <b>flagellum</b> (plural: <b>flagella</b>) spins around like a propeller. This makes the cell roll and tumble forward.</p><div class="note"><b>pili</b> = short hairs that help the cell hold on to surfaces.<br><b>capsule</b> = a sticky outer layer. It protects the cell from drying out and helps it stick. The plaque on your teeth is millions of sticky bacteria! 🪥</div>`,
  src:'Textbook Ch 7.2 (p. 56–57)'},

 {type:'sort',tag:'Sort It',skill:'compare',q:`Sort each part. Is it found in prokaryotes only, eukaryotes only, or <b>both</b>?`,
  cats:['Prokaryote','Eukaryote','Both'],
  items:[{w:'nucleus',c:1},{w:'nucleoid',c:0},{w:'ribosome',c:2},{w:'membrane',c:2},{w:'mito',c:1}],
  ex:`<p><b>Both:</b> cell membrane and ribosomes (and also cytoplasm and DNA). Every cell has these.</p><div class="note"><b>Eukaryotes only:</b> nucleus, mitochondria, and other organelles with membranes.<br><b>Prokaryotes only:</b> the nucleoid, because their DNA has no room of its own.</div>`,
  src:'Textbook Ch 7.1–7.3'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the thin, flexible layer around EVERY cell that controls what enters and leaves</i>?`,
  opts:['membrane','wall','capsule','cytoplasm'].map(k=>({w:k})),a:0,
  ex:`<p>The <b>cell membrane</b> (also called the <b>plasma membrane</b>) is in every single cell. It decides what comes in and what goes out.</p><div class="note">🧱 <b>Cell WALL</b> = stiff and strong, <b>outside</b> the membrane. Only plants, fungi and most bacteria have one.<br>🫧 <b>Cell MEMBRANE</b> = thin and flexible. <b>Every</b> cell has one. It controls traffic in and out.</div>`,
  src:'Textbook Ch 7.2 (p. 55) · Ch 7.3 (p. 60)'},

 {type:'mc',tag:'Word → Meaning',skill:'words',q:`What does this word mean?`,term:'wall',
  opts:[`A stiff layer OUTSIDE the cell membrane that gives the cell strength and shape`,`A thin layer that controls what enters and leaves the cell`,`A sticky layer that helps bacteria stick to teeth and rocks`,`The jelly inside the cell where the organelles float`],a:0,
  ex:`<p>The <b>cell wall</b> lies just <b>outside</b> the cell membrane. It makes the cell stronger and more <b>rigid</b> (stiff, hard to bend).</p><div class="note">🌾 This is why a wheat stalk can stand up tall, but your skin is soft. Plant cells have walls. Animal cells do not.</div><div class="note">In plants, the wall is made mostly of <b>cellulose</b> (SELL-yoo-lohs), the same fibre that cotton is made of.</div>`,
  src:'Textbook Ch 7.2 (p. 55–56) · cellulose: general knowledge, not in the textbook'},

 {type:'mc',tag:'Arrow ID',skill:'parts',q:`🔬 This is a plant cell. What is the orange arrow pointing to?`,fig:'plcell',arrow:true,
  opts:['membrane','wall','vacuole','cytoplasm'].map(k=>({w:k})),a:0,
  ex:`<p>The arrow points to the <b>thin inner line</b>, just inside the thick brown wall. That is the <b>cell membrane</b>.</p><div class="note">A plant cell has <b>both</b>. From outside to inside:<br>cell wall → cell membrane → cytoplasm.<br>The big blue space in the middle is the <b>vacuole</b>. It stores water.</div>`,
  src:'Textbook Ch 7.2 (p. 55) · Ch 7.3 (p. 77)'},

 {type:'tf',tag:'True or False?',skill:'compare',q:`🐐 <b>Animal cells have a cell wall.</b>`,

 {type:'mc',tag:'Analogy',skill:'parts',q:`🏡 Think of a <b>qala</b>, a family compound with high mud walls and one gate. Which part is most like the <b>cell membrane</b>?`,

 {type:'mc',tag:'Word Detective',skill:'words',term:'perm',
  q:`🔎 <b>permeable</b> means things can pass through it, like water through cloth. <b>selective</b> means choosing. The cell membrane is selectively permeable. What does that mean?`,
  opts:[`It lets only SOME substances pass through`,`It lets everything pass through`,`It lets nothing pass through`,`It is stiff and never changes shape`],a:0,

 {type:'order',tag:'Put in Order',skill:'compare',q:`📏 Put these cells in order of their general size, from <b>SMALLEST</b> to <b>LARGEST</b>.`,

 {type:'mc',tag:'Trick Question',skill:'compare',q:`🤔 Which is bigger: a typical <b>human cell</b> or a typical <b>animal cell</b>?`,

 {type:'mc',tag:'Cell Math',skill:'compare',q:`➗ A plant leaf cell is about <b>100 µm</b> wide. A bacterium is about <b>2 µm</b> long. How many bacteria, lined up end to end, would fit across the plant cell?`,

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the "power plants" of the cell, where most of the cell's energy (ATP) is made</i>?`,

  src:'Textbook Ch 7.3 (p. 79, 81)'},

 {type:'mc',tag:'Where From?',skill:'parts',q:`🧬 Mitochondria have their own DNA. Where do scientists think mitochondria <b>came from</b>?`,
  opts:[`They were once free-living prokaryotes that got inside a bigger cell and stayed`,`The nucleus builds them from spare DNA`,`They are broken pieces of old chloroplasts`,`They come from the food we eat`],a:0,

 {type:'mc',tag:'Word Detective',skill:'words',term:'endo',

 {type:'mc',tag:'Which is NOT?',skill:'parts',q:`Scientists have clues that mitochondria were once bacteria. Which one is <b>NOT</b> a real clue?`,

 {type:'pic',tag:'Pick the Picture',skill:'compare',q:`👆 Tap the picture that has a <b>cell wall</b> but <b>NO nucleus</b>.`,

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const wordHTML = (k)=>{const w=W[k];return `<span class="main">${w[0]}</span><span class="say">🔊 ${w[1]}</span>`};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LET = ['A','B','C','D'];
const PRAISE = ['Excellent! 🎉','Well done! 🌟','Baa-rilliant! 🐑','Correct! Great memory 💙','Yes! You are a cell expert 🔬'];
const OOPS = ['I mixed that one up too! Let\'s see why…','Almost! These words are tricky.','Good try! Sheep will explain.','Oops! I learn best from mistakes.'];
const SKILLS = {words:'📖 Words',parts:'🔬 Cell Parts',compare:'⚖️ Compare'};

const state = {i:0,score:0,res:[],order:[],sort:{},locked:false,skill:{}};
const app = $('#app');

/* ---------- Screens ---------- */
function intro(){
  app.innerHTML = `
  <section class="card">
    <h1>Cell Quest 🔬</h1>
    <div class="badge-free">✅ This quiz is NOT graded. It is NOT recorded. It does NOT affect your mark. It is just for practice!</div>
    <div class="chat">
      <div class="bubble"><span class="who" aria-hidden="true">🐑</span><p><b>Sheep:</b> Salaam! Today we practise the two kinds of cells: <b>prokaryotes</b> and <b>eukaryotes</b>, and the parts inside them. There are 20 questions.</p></div>
      <div class="bubble rab"><span class="who" aria-hidden="true">🐰</span><p><b>Rabbit:</b> Cell wall, cell membrane… they sound the same to me! 😅 Every new word shows how to say it, and Sheep explains every answer.</p></div>
    </div>
    <ul class="types" aria-label="Question types">
      <li>📖 Word → Meaning</li><li>🔤 Meaning → Word</li><li>🔎 Word Detective</li><li>🗂️ Sort It</li><li>➡️ Arrow ID</li><li>✅ True or False</li><li>🔢 Put in Order</li><li>➗ Cell Math</li><li>🚫 Which is NOT?</li>
    </ul>
    <p class="hint">Tip: on a computer you can press keys 1–4 to answer and Enter for the next question.</p>
    <div class="row"><button class="btn" id="start">Start ▶</button></div>
  </section>`;
  $('#start').onclick = ()=>{reset();show()};
  $('#start').focus();
}
function reset(){state.i=0;state.score=0;state.res=[];state.skill={};Object.keys(SKILLS).forEach(k=>state.skill[k]=[0,0])}

function header(){
  const d = Q.map((_,k)=>`<span class="${state.res[k]===true?'ok':state.res[k]===false?'no':k===state.i?'now':''}"></span>`).join('');
  return `<div class="top"><span>Question <b>${state.i+1}</b> of ${Q.length}</span><span>Score: <b>${state.score}</b></span></div><div class="dots" aria-hidden="true">${d}</div>`;
}

function show(){
  state.locked=false;
  const q = Q[state.i];
  let body = '';
  if(q.term){const w=W[q.term];body+=`<div class="term"><span class="en">${w[0]}</span><span class="say">🔊 ${w[1]}</span></div>`}
  if(q.fig) body+=`<div class="fig">${cell(q.fig,q.arrow)}</div>`;

  if(q.type==='mc'||q.type==='tf'){
    const order = q.type==='tf'?q.opts.map((o,k)=>k):shuffle(q.opts.map((o,k)=>k));
    body += `<div class="opts${q.type==='tf'?' tf':''}">${order.map((k,n)=>{const o=q.opts[k];const inner=typeof o==='string'?`<span class="main">${o}</span>`:wordHTML(o.w);return `<button class="opt" data-k="${k}">${q.type==='tf'?'':`<span class="k">${LET[n]}</span>`}<span class="body">${inner}</span><span class="mark"></span></button>`}).join('')}</div>`;
  } else if(q.type==='pic'){
    const order = shuffle(q.pics.map((p,k)=>k));
    body += `<div class="pics">${order.map((k,n)=>`<button class="opt pic" data-k="${k}" aria-label="Picture ${LET[n]}">${cell(q.pics[k])}<span class="cap"><span class="k">${LET[n]}</span><span class="name" hidden>${W[q.pics[k]][0]}</span><span class="mark"></span></span></button>`).join('')}</div>`;
  } else if(q.type==='order'){
    state.order=[];
    const mix = shuffle(q.items);
    body += `<div class="slots">${q.items.map((_,n)=>`<button class="slot" data-n="${n}" aria-label="Place ${n+1}"><span class="num">${n===0?'1 · smallest':n===q.items.length-1?n+1+' · largest':n+1}</span><span class="val hint">tap a cell below</span></button>`).join('')}</div>
      <div class="chips">${mix.map(k=>`<button class="chip" data-w="${k}">${W[k][0]}</button>`).join('')}</div>
      <p class="hint">Tap a filled box to take the answer back.</p>
      <div class="row"><button class="btn" id="check" disabled>Check my order</button></div>`;
  } else if(q.type==='sort'){
    state.sort={};
    body += `<div class="sort">${q.items.map((it,n)=>`<div class="srow" data-n="${n}"><div class="lab"><b>${W[it.w][0]}</b><span class="say">🔊 ${W[it.w][1]}</span></div><div class="seg" role="group" aria-label="${W[it.w][0]}">${q.cats.map((c,ci)=>`<button data-n="${n}" data-c="${ci}" aria-pressed="false">${c}</button>`).join('')}</div></div>`).join('')}</div>
      <div class="row"><button class="btn" id="check" disabled>Check my answers</button></div>`;
  }

  app.innerHTML = `${header()}<section class="card" aria-live="polite"><span class="tag">${q.tag}</span><p class="qtext">${q.q}</p>${body}<div id="fb"></div></section>`;

  if(q.type==='mc'||q.type==='tf'||q.type==='pic') app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(q.type==='order') wireOrder(q);
  if(q.type==='sort') wireSort(q);
  window.scrollTo({top:0});
}

function wireOrder(q){
  const render=()=>{
    app.querySelectorAll('.slot').forEach((s,n)=>{const k=state.order[n];s.classList.toggle('filled',!!k);s.querySelector('.val').outerHTML = k?`<span class="val"><b>${W[k][0]}</b></span>`:`<span class="val hint">tap a cell below</span>`});
    app.querySelectorAll('.chip').forEach(c=>c.hidden=state.order.includes(c.dataset.w));
    $('#check').disabled = state.order.length!==q.items.length;
  };
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(state.locked)return;state.order.push(c.dataset.w);render()});
  app.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(state.locked)return;const n=+s.dataset.n;if(n<state.order.length){state.order.splice(n,1);render()}});
  $('#check').onclick=()=>{
    state.locked=true;
    let ok=true;
    app.querySelectorAll('.slot').forEach((s,n)=>{const r=state.order[n]===q.items[n];if(!r)ok=false;s.classList.add(r?'right':'wrong');s.insertAdjacentHTML('beforeend',`<span class="mark" style="margin-left:auto">${r?'✅':'❌'}</span>`)});
    $('#check').remove();
    finish(ok);
  };
}

function wireSort(q){
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    if(state.locked) return;
    const n=+b.dataset.n, c=+b.dataset.c; state.sort[n]=c;
    b.parentElement.querySelectorAll('button').forEach(x=>{const on=+x.dataset.c===c;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
    $('#check').disabled = Object.keys(state.sort).length!==q.items.length;
  });
  $('#check').onclick=()=>{
    state.locked=true; let ok=true;
    app.querySelectorAll('.srow').forEach((r,n)=>{
      const right = state.sort[n]===q.items[n].c; if(!right) ok=false;
      r.classList.add(right?'right':'wrong');
      r.querySelectorAll('button').forEach(x=>x.disabled=true);
      r.querySelector('.lab').insertAdjacentHTML('beforeend', right?`<span class="mark">✅</span>`:`<span class="fix">❌ Answer: ${q.cats[q.items[n].c]}</span>`);
    });
    $('#check').remove();
    finish(ok);
  };
}

function answer(k){
  if(state.locked) return; state.locked=true;
  const q=Q[state.i]; const ok = k===q.a;
  app.querySelectorAll('.opt').forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.a){b.classList.add('right');b.querySelector('.mark').textContent='✅'}
    else if(bk===k){b.classList.add('wrong');b.querySelector('.mark').textContent='❌'}
    else b.classList.add('dim');
    const nm=b.querySelector('.name'); if(nm) nm.hidden=false;
  });
  finish(ok);
}

function correctText(q){
  if(q.type==='order') return q.items.map(k=>W[k][0]).join(' → ');
  if(q.type==='pic') return W[q.pics[q.a]][0];
  if(q.type==='sort') return q.items.map(it=>`${W[it.w][0]}: ${q.cats[it.c]}`).join(' · ');
  const o=q.opts[q.a]; return typeof o==='string'?o:W[o.w][0];
}

function finish(ok){
  const q=Q[state.i];
  state.res[state.i]=ok; if(ok) state.score++;
  state.skill[q.skill][1]++; if(ok) state.skill[q.skill][0]++;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const last = state.i===Q.length-1;
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">
    <p class="verdict">${ok?pick(PRAISE):'Not quite ❌'}</p>
    ${ok?'':`<div class="bubble rab"><span class="who" aria-hidden="true">🐰</span><p><b>Rabbit:</b> ${pick(OOPS)}</p></div><p><b>Correct answer:</b> ${correctText(q)}</p>`}
    <div class="bubble"><span class="who" aria-hidden="true">🐑</span><div class="ex"><p><b>Sheep explains:</b></p>${q.ex}</div></div>
    <p class="src">📚 From: ${q.src}</p>
    <div class="next-row"><button class="btn" id="next">${last?'See my score 🎉':'Next ▶'}</button></div>
  </div>`;
  app.querySelector('.top span:last-child b').textContent = state.score;
  const d=app.querySelectorAll('.dots span')[state.i]; d.className = ok?'ok':'no';
  $('#next').onclick=()=>{ if(last) results(); else {state.i++;show()} };
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}

function results(){
  const s=state.score, n=Q.length;
  const stars = s>=18?'⭐⭐⭐':s>=13?'⭐⭐☆':s>=8?'⭐☆☆':'☆☆☆';
  const msg = s>=18?'Excellent! You really know your cell words. 🏆':s>=13?'Great work! Look at the questions below to make it even better. 💪':s>=8?'Good start! Read the explanations below and try again. 🌱':'These are hard new words. Read the explanations below and try again. You can do it! 💙';
  const sk=k=>`<div class="skill"><b>${state.skill[k][0]}/${state.skill[k][1]}</b><span>${SKILLS[k]}</span></div>`;
  const missed = Q.map((q,k)=>({q,k})).filter(o=>state.res[o.k]===false);
  app.innerHTML = `<section class="card" style="align-items:center;text-align:center">
    <h2>Quest complete!</h2>
    <div class="score">${s}/${n}</div>
    <div class="stars" aria-label="${stars.split('⭐').length-1} stars">${stars}</div>
    <div class="bubble" style="text-align:left"><span class="who" aria-hidden="true">🐑</span><p><b>Sheep:</b> ${msg}</p></div>
    <div class="skills" style="width:100%">${Object.keys(SKILLS).map(sk).join('')}</div>
    <div class="badge-free" style="width:100%">✅ Remember: this is NOT graded, NOT recorded, and does NOT affect your mark.</div>
  </section>
  ${missed.length?`<section class="card"><h2>Look at these again 👀</h2>${missed.map(({q,k})=>`<details><summary>Q${k+1}. ${q.tag}: ${correctText(q)}</summary><div class="ex"><p class="hint">${q.q}</p>${q.ex}</div></details>`).join('')}</section>`:`<section class="card"><p>🐰 <b>Rabbit:</b> ${n} out of ${n}! Wow! Can you teach me? 😄</p></section>`}
  <div class="row" style="justify-content:center"><button class="btn" id="again">Try again 🔁</button></div>`;
  $('#again').onclick=()=>{reset();show()};
  if(s>=8) confetti(s>=18?260:140);
  window.scrollTo({top:0});
}

/* ---------- Confetti (no internet needed) ---------- */
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'); cv.hidden=false; const cx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--lapis','--saffron','--good','--chloro','--mito'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){cx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(++t<260) requestAnimationFrame(f); else {cx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})();
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  const n=['1','2','3','4'].indexOf(e.key)>-1?+e.key-1:['a','b','c','d'].indexOf(e.key.toLowerCase());
  const opts=app.querySelectorAll('.opt');
  if(n>-1 && opts[n] && !state.locked){opts[n].click();return}
  if((e.key==='Enter'||e.key==='ArrowRight') && $('#next')){e.preventDefault();$('#next').click()}
});

intro();
</script>
