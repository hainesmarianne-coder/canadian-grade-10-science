<meta charset="utf-8">
<title>Cell Specialists</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one centred column, one question card at a time, big tap targets for phones.
   Palette: turquoise Herat tilework + old gold, on a pale tile-grout ground. */
:root{
  --bg:#EDF2F1;
  --surface:#FFFFFF;
  --ink:#16201F;
  --muted:#50605D;
  --line:#D0DBD9;
  --main:#0D5C63;      /* turquoise tile: main colour */
  --main-soft:#DCEFEE;
  --gold:#855D00;      /* old gold: accent */
  --gold-soft:#F6EACB;
  --good:#1B7F3B; --good-soft:#E3F4E8;
  --bad:#C62828;  --bad-soft:#FCE6E6;
  /* cell drawings */
  --cell-fill:#E3F1F0; --cell-line:#0D5C63;
  --nuc-fill:#F6EACB; --nuc-line:#9A6B00;
  --rbc:#C2413A; --rbc-light:#EC9A8F;
  --skin:#F2DECB; --skin-line:#A0704A;
  --stripe:#7FB3B6;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1617;--surface:#172122;--ink:#E9F1F0;--muted:#9FB1AE;--line:#2C3A3B;
  --main:#6FD0D6;--main-soft:#16363A;--gold:#E9C46A;--gold-soft:#3A3016;
  --good:#5AD184;--good-soft:#173524;--bad:#FF7A6E;--bad-soft:#3A1C1C;
  --cell-fill:#1B3134;--cell-line:#6FD0D6;--nuc-fill:#3A3016;--nuc-line:#E9C46A;
  --rbc:#E66A5E;--rbc-light:#8E3B34;--skin:#4A3A2C;--skin-line:#D2A27A;--stripe:#3F7F84;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1617;--surface:#172122;--ink:#E9F1F0;--muted:#9FB1AE;--line:#2C3A3B;
  --main:#6FD0D6;--main-soft:#16363A;--gold:#E9C46A;--gold-soft:#3A3016;
  --good:#5AD184;--good-soft:#173524;--bad:#FF7A6E;--bad-soft:#3A1C1C;
  --cell-fill:#1B3134;--cell-line:#6FD0D6;--nuc-fill:#3A3016;--nuc-line:#E9C46A;
  --rbc:#E66A5E;--rbc-light:#8E3B34;--skin:#4A3A2C;--skin-line:#D2A27A;--stripe:#3F7F84;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:18px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.4rem;font-weight:800;color:var(--main)}
h2{font-size:1.45rem;font-weight:800}
p{margin:0}
.say{font-size:.85em;color:var(--muted);letter-spacing:.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{background:var(--main);color:var(--surface);border:0;border-radius:14px;min-height:56px;padding:12px 22px;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Intro */
.badge-free{background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px 14px;font-weight:700}
.chat{display:flex;flex-direction:column;gap:10px}
.bubble{display:flex;gap:10px;align-items:flex-start}
.bubble .who{font-size:2rem;line-height:1;flex:none}
.bubble > p,.bubble > .ex{background:var(--main-soft);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.bubble.rab > p{background:var(--gold-soft)}
.types{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.types li{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem}

/* Progress */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.95rem;color:var(--muted)}
.top b{color:var(--ink);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dots span{height:8px;border-radius:4px;background:var(--line)}
.dots span.now{background:var(--gold)}
.dots span.ok{background:var(--good)}
.dots span.no{background:var(--bad)}

/* Question */
.tag{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:8px;padding:2px 10px}
.qtext{font-size:1.3rem;font-weight:700;line-height:1.4}
.term{border:2px dashed var(--nuc-line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.term .en{font-family:var(--f-display);font-weight:800;font-size:1.8rem;color:var(--main);line-height:1.1}
.fig{background:var(--bg);border-radius:14px;padding:8px;display:flex;justify-content:center}
.fig svg{width:100%;max-width:360px;height:auto;display:block}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:60px;padding:10px 14px;width:100%}
.opt:hover:not([disabled]){border-color:var(--main)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--main-soft);color:var(--main);font-family:var(--f-display);font-weight:800}
.opt .body{display:flex;flex-direction:column;min-width:0}
.opt .body .main{font-weight:700;font-size:1.1rem}
.opt .mark{margin-left:auto;font-size:1.4rem;flex:none}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.opts.tf{flex-direction:row}
.opts.tf .opt{justify-content:center}

.pics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pic{flex-direction:column;align-items:stretch;padding:8px;gap:6px;min-width:0}
.pic svg{width:100%;height:auto;display:block}
.pic .cap{display:flex;gap:8px;align-items:center}
.pic .name{font-weight:700;font-size:.95rem}

/* Order */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;width:100%;background:transparent;text-align:left}
.slot.filled{border-style:solid;border-color:var(--main);background:var(--main-soft)}
.slot .num{font-family:var(--f-display);font-weight:800;width:auto;min-width:28px;color:var(--main)}
.slot.right{border-color:var(--good);background:var(--good-soft)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--main);background:var(--surface);color:var(--main);border-radius:999px;padding:8px 16px;min-height:48px;font-weight:700}
.hint{font-size:.95rem;color:var(--muted)}

/* Sort */
.sort{display:flex;flex-direction:column;gap:10px}
.srow{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.srow .lab{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.srow .lab b{font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:.92rem;padding:4px}
.seg button.on{border-color:var(--main);background:var(--main-soft);color:var(--main)}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow .fix{font-size:.95rem;font-weight:700}

/* Feedback */
.fb{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;border:2px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)}
.fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .verdict{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.fb.ok .verdict{color:var(--good)}
.fb.no .verdict{color:var(--bad)}
.ex{display:flex;flex-direction:column;gap:8px}
.ex .note{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.95rem}
.src{font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.next-row{display:flex;justify-content:flex-end}

/* Results */
.score{font-family:var(--f-display);font-weight:800;font-size:4rem;line-height:1;color:var(--main);font-variant-numeric:tabular-nums}
.stars{font-size:2rem;letter-spacing:4px}
.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skill{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.skill b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.skill span{font-size:.85rem;color:var(--muted)}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details .ex{margin-top:10px}
#confetti{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:10}
@media (max-width:420px){ h1{font-size:2rem} .qtext{font-size:1.18rem} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }


/* SVG cell drawings */
.d-cell{fill:var(--cell-fill);stroke:var(--cell-line);stroke-width:2.5}
.d-nuc{fill:var(--nuc-fill);stroke:var(--nuc-line);stroke-width:2.5}
.d-line{fill:none;stroke:var(--cell-line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.d-rbc{fill:var(--rbc);stroke:var(--rbc);stroke-width:1}
.d-rbc2{fill:var(--rbc-light)}
.d-skin{fill:var(--skin);stroke:var(--skin-line);stroke-width:2}
.d-snuc{fill:var(--skin-line)}
.d-stripe{stroke:var(--stripe);stroke-width:2}
</style>

<canvas id="confetti" hidden></canvas>
<main class="wrap" id="app"></main>

<script>
/* ---------- Words: English, say it ---------- */
const W = {
  specialized:['specialized cell','SPESH-uh-lyzd sell'],
  differentiation:['differentiation','dif-uh-ren-shee-AY-shun'],
  stem:['stem cell','STEM sell'],
  rbc:['red blood cell','RED BLUD sell'],
  nerve:['nerve cell','NURV sell'],
  skin:['skin cells','SKIN sellz'],
  muscle:['muscle cell','MUS-ul sell'],
  cancer:['cancer cell','KAN-ser sell'],
  marrow:['bone marrow','BOHN MAIR-oh'],
  cartilage:['cartilage','KAR-tih-lij'],
  capillaries:['capillaries','KAP-ih-lair-eez'],
  meristem:['meristem','MAIR-ih-stem'],
  meristematic:['meristematic tissue','mair-ih-stuh-MAT-ik TISH-oo'],
  embryonic:['embryonic stem cells','em-bree-ON-ik STEM sellz'],
  adult:['adult stem cells','uh-DULT STEM sellz'],
  regeneration:['regeneration','ree-jen-er-AY-shun'],
  ethics:['ethics','ETH-iks'],
  cell:['cell','SELL'],
  tissue:['tissue','TISH-oo'],
  organ:['organ','OR-gun'],
  system:['organ system','OR-gun SIS-tum'],
  organism:['organism','OR-guh-niz-um'],
  organelle:['organelle','or-guh-NEL'],
  marrowstem:['bone marrow stem cell','BOHN MAIR-oh STEM sell'],
  rootstem:['root tip meristem cell','ROOT tip MAIR-ih-stem sell']
};

/* ---------- Cell drawings ---------- */
let clipN=0;
function cell(name){
  const S = (inner,label)=>`<svg viewBox="0 0 240 160" role="img" aria-label="${label}">${inner}</svg>`;
  if(name==='rbc') return S(
    `<circle class="d-rbc" cx="88" cy="80" r="50"/><circle class="d-rbc2" cx="88" cy="80" r="22"/>
     <path class="d-rbc" d="M180,34 C188,26 204,26 212,34 C220,42 202,62 202,80 C202,98 220,118 212,126 C204,134 188,134 180,126 C172,118 190,98 190,80 C190,62 172,42 180,34Z"/>`,
    'Red blood cells: round flat discs, thinner in the middle, with no nucleus');
  if(name==='nerve') return S(
    `<path class="d-line" d="M44,62 L30,40 M30,40 L18,38 M30,40 L28,26 M38,96 L22,116 M22,116 L10,114 M22,116 L22,130 M60,96 L66,122 M34,72 L12,70 M58,62 L70,40 M70,40 L82,36"/>
     <circle class="d-cell" cx="46" cy="80" r="20"/><circle class="d-nuc" cx="46" cy="80" r="8"/>
     <path class="d-line" d="M66,80 L206,80 M206,80 L224,66 M206,80 L228,80 M206,80 L224,94"/>
     <rect class="d-cell" x="86" y="73" width="26" height="14" rx="7"/><rect class="d-cell" x="122" y="73" width="26" height="14" rx="7"/><rect class="d-cell" x="158" y="73" width="26" height="14" rx="7"/>`,
    'A nerve cell: a cell body with short branches and one very long, thin fibre like a wire');
  if(name==='skin'){
    let t=''; const rows=[[22,28],[60,24],[96,24],[132,20]];
    rows.forEach(([y,h],r)=>{ const off=r%2?-22:0; for(let x=12+off;x<228;x+=44){ const x0=Math.max(12,x), x1=Math.min(228,x+44); t+=`<rect class="d-skin" x="${x0}" y="${y}" width="${x1-x0}" height="${h}"/>`; if(x1-x0>20) t+=`<ellipse class="d-snuc" cx="${(x0+x1)/2}" cy="${y+h/2}" rx="6" ry="3"/>`; } });
    return S(t,'Skin cells: flat cells packed tightly together in layers, like tiles');
  }
  if(name==='muscle'){
    const id='mc'+(clipN++); let s='';
    for(let x=30;x<=210;x+=9) s+=`<line class="d-stripe" x1="${x}" y1="40" x2="${x}" y2="120"/>`;
    const d='M14,80 C60,46 180,46 226,80 C180,114 60,114 14,80Z';
    return S(`<defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs><path class="d-cell" d="${d}"/><g clip-path="url(#${id})">${s}</g><path class="d-line" d="${d}" style="stroke-width:2.5"/>
      <ellipse class="d-nuc" cx="70" cy="80" rx="10" ry="5"/><ellipse class="d-nuc" cx="120" cy="80" rx="10" ry="5"/><ellipse class="d-nuc" cx="170" cy="80" rx="10" ry="5"/>`,
      'A muscle cell: long and thin with stripes and several nuclei');
  }
  if(name==='stem') return S(
    `<circle class="d-cell" cx="120" cy="80" r="56"/><circle class="d-nuc" cx="120" cy="80" r="26"/>`,
    'A plain round cell with a large nucleus and no special shape');
}

/* ---------- Questions ---------- */
const Q = [
 {type:'mc',tag:'Word → Meaning',skill:'words',q:`What does this word mean?`,term:'specialized',
  opts:[`A cell with a special shape that helps it do one special job`,`A cell that can still become any kind of cell`,`A cell that divides out of control`,`A cell with no nucleus, like a bacterium`],a:0,
  ex:`<p>A <b>specialized cell</b> has a special <b>job</b>, and its <b>shape</b> helps it do that job. Your body has hundreds of kinds: blood cells, nerve cells, skin cells, muscle cells…</p><div class="note">🧩 The wrong answers are other words: can become any cell = <b>stem cell</b>. Divides out of control = <b>cancer cell</b>. No nucleus = <b>prokaryote</b>.</div>`,
  src:'Textbook Ch 4 (p. 27) · Curriculum B3.2'},

 {type:'pic',tag:'Pick the Picture',skill:'cells',q:`👆 Tap the cell that carries <b>oxygen</b> around the body.`,
  pics:['rbc','nerve','skin','muscle'],a:0,
  ex:`<p><b>Red blood cells</b> are shaped like flat discs, thinner in the middle. This shape lets them squeeze quickly through tiny blood vessels and carry oxygen everywhere.</p><div class="note">🩸 A grown-up red blood cell has <b>no nucleus</b>. That leaves more room to carry oxygen. <span class="say">(No-nucleus fact: general knowledge.)</span></div>`,
  src:'Textbook Ch 4 (p. 27) · Curriculum B2.4'},

 {type:'mc',tag:'Picture ID',skill:'cells',q:`🔬 Look at this cell. What is its job?`,fig:'nerve',
  opts:[`Send messages (signals) quickly around the body`,`Carry oxygen in the blood`,`Protect the body by fitting tightly together`,`Make food from sunlight`],a:0,
  ex:`<p>This is a <b>nerve cell</b>. It is long and thin, like a <b>wire</b>. It carries signals very fast. For example, it tells your brain "Hot! Move your hand!" when you touch a hot teapot. 🫖🔥</p><div class="note">📞 Like a telephone wire: a long line that carries a message from one place to another.</div>`,
  src:'Textbook Ch 4 (p. 27)'},

 {type:'mc',tag:'Shape → Job',skill:'cells',q:`Skin cells are <b>flat</b> and fit <b>tightly together</b> in layers. Why is this shape useful?`,fig:'skin',
  opts:[`It makes a strong cover that protects the body`,`It helps the cells swim`,`It helps the cells carry oxygen`,`It helps the cells send signals to the brain`],a:0,
  ex:`<p>Flat cells packed tightly make a <b>barrier</b> (a wall) that keeps germs and dirt out and water in.</p><div class="note">🕌 Like the tiles on the Blue Mosque in Mazar-i-Sharif: many small flat pieces, fitted tightly, cover and protect the wall.</div><div class="note">💡 <b>Big idea:</b> a cell's <b>shape</b> (structure) matches its <b>job</b> (function).</div>`,
  src:'Textbook Ch 4 (p. 27)'},

 {type:'mc',tag:'Word Detective',skill:'words',term:'differentiation',
  q:`🔎 <b>differ</b> means <b>to be different</b>. <b>-ation</b> is a suffix that means <b>a process</b>. So what is differentiation?`,
  opts:[`The process where a plain cell changes into a specialized cell`,`The process where one cell divides into two identical cells`,`The process where cells divide out of control`,`The process where a cell copies its DNA`],a:0,
  ex:`<p>differ + ation = the process of <b>becoming different</b>. A plain, unspecialized cell gets a special shape and job.</p><div class="note">🧩 Dividing into two identical cells = <b>mitosis</b>. Out of control = <b>cancer</b>. Copying DNA = <b>interphase</b>.<br>⭐ <i>Differentiation</i> is on the official curriculum word list!</div>`,
  src:'Textbook Ch 16.1 (p. 244) · Curriculum B2.1'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>an unspecialized cell that can divide and become many different kinds of cells</i>?`,
  opts:['stem','specialized','cancer','organelle'].map(k=>({w:k})),a:0,
  ex:`<p>A <b>stem cell</b> has not chosen its job yet. It can divide, and its daughter cells can <b>differentiate</b> into blood, muscle, nerve cells and more.</p><div class="note">🌳 Why "stem"? Like a tree trunk: all the branches grow out from it. It has nothing to do with the stem of a plant!</div>`,
  src:'Curriculum B3.2 · general knowledge (the textbook only links to videos on stem cells)'},

 {type:'mc',tag:'Analogy',skill:'stem',q:`🎓 Which person is most like a <b>stem cell</b>?`,
  opts:[`A new student who has not chosen a job yet. She could become a doctor, a teacher or an engineer`,`A doctor who has already finished her training`,`A teacher who has worked at the same school for 30 years`,`A carpet that is already finished`],a:0,
  ex:`<p>A stem cell is <b>full of possibilities</b>, just like a student who can still choose many careers. 👩‍🎓</p><div class="note">👩‍⚕️ The trained doctor is like a <b>specialized cell</b>: she is very good at one job, and it is hard to change to a completely different one.</div>`,
  src:'Analogy · Curriculum B3.2'},

 {type:'mc',tag:'Big Idea',skill:'stem',q:`🧬 Your nerve cells and your skin cells look completely different. Do they have the <b>same DNA</b>?`,
  opts:[`Yes. Every cell has the same DNA, but each kind of cell uses different parts of it`,`No. Each kind of cell has completely different DNA`,`No. Only nerve cells have DNA`,`Yes, but only until you are 10 years old`],a:0,
  ex:`<p>All your cells came from <b>one cell</b> by mitosis, and mitosis makes <b>identical</b> copies. So every cell has the same DNA. Each kind of cell just <b>switches on</b> different instructions.</p><div class="note">📖 Like a family recipe book. Every cook in the family has the same book. One cook uses the qabuli palaw page, another uses the bolani page. Same book, different recipes!</div>`,
  src:'Textbook Ch 5.4 (mitosis makes identical cells) · switching genes on: general knowledge'},

 {type:'tf',tag:'True or False?',skill:'stem',q:`When a cell <b>differentiates</b>, it changes its DNA.`,
  opts:['✅ True','❌ False'],a:1,
  ex:`<p><b>False.</b> The DNA stays the same. The cell only changes <b>which parts</b> of the DNA it uses. That changes its shape and its job.</p><div class="note">📖 Same recipe book, different page. You do not rewrite the book!</div>`,
  src:'General knowledge (builds on the textbook idea that mitosis makes identical cells)'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>the soft tissue inside your bones, where stem cells make new blood cells</i>?`,
  opts:['marrow','cartilage','meristem','capillaries'].map(k=>({w:k})),a:0,
  ex:`<p><b>Bone marrow</b> is soft tissue inside big bones. Its stem cells make <b>millions</b> of new blood cells every second.</p><div class="note">🍖 If you have ever cooked soup with a lamb bone, the soft part inside the bone is the marrow.</div><div class="note">⚠️ <b>Cartilage</b> = the bendy tissue in your ears and nose. <b>Capillaries</b> = the tiniest blood vessels. <b>Meristem</b> = growing tissue in plants.</div>`,
  src:'Textbook Ch 8.1 (skeletal system makes blood cells) · general knowledge'},

 {type:'mc',tag:'Compare',skill:'stem',q:`Which kind of stem cell can become <b>ANY</b> type of cell in the body?`,
  opts:['embryonic','adult','rbc','skin'].map(k=>({w:k})),a:0,
  ex:`<p><b>Embryonic stem cells</b> come from an <b>embryo</b>: a tiny ball of cells only a few days old. They can become <b>any</b> of the body's cell types.</p><div class="note"><b>Adult stem cells</b> can only become a <b>few</b> types. For example, bone marrow stem cells make blood cells.<br>⚠️ "Adult" here just means "after birth". Children have adult stem cells too!</div>`,
  src:'Textbook Ch 14.3 (Explore More Q9) · general knowledge'},

 {type:'sort',tag:'Sort It',skill:'stem',q:`Sort each cell. Is it <b>specialized</b> (has a special job) or <b>unspecialized</b> (can still become other cells)?`,
  cats:['Specialized','Unspecialized'],
  items:[{w:'rbc',c:0},{w:'marrowstem',c:1},{w:'nerve',c:0},{w:'rootstem',c:1},{w:'muscle',c:0}],
  ex:`<p><b>Specialized:</b> red blood cell, nerve cell, muscle cell. Each has one special job.</p><div class="note"><b>Unspecialized:</b> bone marrow stem cells (animals) and meristem cells (plants). They can still divide and become other cells.</div>`,
  src:'Textbook Ch 4 · Ch 16.1 · Curriculum B3.2'},

 {type:'mc',tag:'Plants Too!',skill:'words',term:'meristematic',
  q:`🌱 Plants do not have bone marrow. Where are a plant's unspecialized "stem cells"?`,
  opts:[`In meristem tissue at the tips of roots and shoots`,`Only inside the flowers`,`Inside the chloroplasts`,`Inside the cell walls`],a:0,
  ex:`<p><b>Meristem</b> is plant tissue made of <b>undifferentiated</b> cells (un- = not) that keep dividing. It sits at the <b>tips</b> of roots and shoots, so the plant can keep growing longer all its life.</p><div class="note">🌾 <b>Meristematic</b> is on the official curriculum word list. The textbook says: once plant cells differentiate, they can no longer divide. That is why plants need meristem.</div>`,
  src:'Textbook Ch 16.1 (p. 244) · Ch 5.4 · Curriculum B2.1, B3.2'},

 {type:'mc',tag:'Word Detective',skill:'words',term:'regeneration',
  q:`🔎 <b>re-</b> means <b>again</b>. <b>gen</b> means <b>to make</b> (like <i>gen</i>erate). So what is regeneration?`,
  opts:[`Growing back a body part that was lost or damaged`,`Copying DNA before mitosis`,`A cell dying when it is old`,`Breathing in and out again`],a:0,
  ex:`<p>re + gen = <b>make again</b>. Some living things can grow back lost parts.</p><div class="note">🪱 Earthworms can regrow segments that break off.<br>🐑 Grass grows back after sheep eat it, because its meristem is at the bottom of the leaf, not the tip. (Sheep says thank you!)<br>⭐ <i>Regeneration</i> is on the curriculum word list.</div>`,
  src:'Textbook Ch 8.2 (earthworms) · Ch 16.1 (grass) · Curriculum B2.1'},

 {type:'order',tag:'Put in Order',skill:'cells',q:`🏗️ Put these levels in order, from the <b>smallest</b> to the <b>biggest</b>.`,ends:['smallest','biggest'],
  items:['cell','tissue','organ','system','organism'],
  ex:`<p>cell → tissue → organ → organ system → organism</p><div class="note">🧱 Like building a city: bricks (cells) → a wall (tissue) → a room (organ) → a house (organ system) → the whole city (organism).<br>Example: heart muscle cells → heart muscle tissue → heart → circulatory system → you!</div>`,
  src:'Textbook Ch 4 (p. 28) · Curriculum B3.3'},

 {type:'mc',tag:'Meaning → Word',skill:'words',q:`Which word means: <i>a group of similar specialized cells working together to do one job</i>?`,
  opts:['tissue','organ','system','organelle'].map(k=>({w:k})),a:0,
  ex:`<p>A <b>tissue</b> is a team of similar cells. For example, many muscle cells together make <b>muscle tissue</b>.</p><div class="note">⚠️ Look-alike words!<br><b>organelle</b> = a tiny part <b>inside</b> one cell<br><b>organ</b> = two or more tissues working together (like the heart)<br><b>organ system</b> = organs working together</div>`,
  src:'Textbook Ch 4 (p. 28) · Ch 8.1'},

 {type:'mc',tag:'Cell Math',skill:'cells',q:`➗ Your bone marrow makes about <b>2 million</b> new red blood cells every <b>second</b>. About how many does it make in one <b>minute</b>?`,
  opts:['120 million','2 million','62 million','33 thousand'],a:0,
  ex:`<p>1 minute = 60 seconds, so multiply by 60.</p><div class="note">2 000 000 × 60 = <b>120 000 000</b> = 120 million red blood cells every minute! 🤯</div><div class="note">❌ 2 million forgot to multiply. ❌ 62 million added 60 instead of multiplying. ❌ 33 thousand divided by 60.</div>`,
  src:'General knowledge (about 2 million per second is a common estimate)'},

 {type:'mc',tag:'Real Life',skill:'stem',q:`🏥 Which is a <b>real</b> way doctors use stem cells to treat people <b>today</b>?`,
  opts:[`Bone marrow transplants, to treat some blood cancers like leukemia`,`Growing a whole new arm in one week`,`One pill that cures every kind of cancer`,`Making people live forever`],a:0,
  ex:`<p>In a <b>bone marrow transplant</b>, healthy stem cells from a donor are put into a patient. They make new, healthy blood cells. This can treat <b>leukemia</b> (loo-KEE-mee-uh), a cancer of the white blood cells.</p><div class="note">🔬 Scientists are still <b>researching</b> other uses, for example Parkinson's disease and heart disease. These are hopes for the future, not normal treatments yet.</div>`,
  src:'Textbook Ch 6 (leukemia) · Ch 14.3 (Parkinson\'s research) · transplants: general knowledge'},

 {type:'mc',tag:'Ethics Talk',skill:'stem',term:'ethics',
  q:`⚖️ <b>Ethics</b> means ideas about what is right and wrong. Why do some people disagree about using <b>embryonic</b> stem cells?`,
  opts:[`Getting them destroys a very early embryo, and people have different beliefs about protecting embryos`,`They are too small to see with a microscope`,`They only work in plants`,`They come from bone marrow, so collecting them hurts`],a:0,
  ex:`<p>To collect embryonic stem cells, a very early embryo (a few days old) is destroyed. People with different beliefs see this differently.</p><div class="note">💬 <b>Some people say:</b> these cells could help treat serious diseases, so the research is important.<br>💬 <b>Other people say:</b> an embryo should be protected, so this research is wrong.<br>There is no single answer that everyone agrees with. That is what makes it an <b>ethical</b> question.</div><div class="note">🔬 Scientists can now also turn ordinary skin cells back into stem cells. Some people feel this avoids the problem. <span class="say">(General knowledge.)</span></div>`,
  src:'Curriculum B1.1 (stem-cell research ethics) · general knowledge'},

 {type:'pic',tag:'Pick the Picture',skill:'cells',q:`👆 Tap the cell that is <b>NOT specialized</b> yet.`,
  pics:['stem','rbc','nerve','muscle'],a:0,
  ex:`<p>The <b>stem cell</b> is plain and round. It has no special shape yet, because it has not chosen its job.</p><div class="note">🩸 Red blood cell = disc shape to carry oxygen<br>⚡ Nerve cell = long wire to send signals<br>💪 Muscle cell = long and striped, to contract (squeeze) and move your body</div>`,
  src:'Textbook Ch 4 · Curriculum B2.4, B3.2'}
];

/* ---------- Helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const wordHTML = (k)=>{const w=W[k];return `<span class="main">${w[0]}</span><span class="say">🔊 ${w[1]}</span>`};
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LET = ['A','B','C','D'];
const PRAISE = ['Excellent! 🎉','Well done! 🌟','Baa-rilliant! 🐑','Correct! Great memory 💙','Yes! You are a cell expert 🔬'];
const OOPS = ['I mixed that one up too! Let\'s see why…','Almost! These words are tricky.','Good try! Sheep will explain.','Oops! I learn best from mistakes.'];



const SKILLS = {words:'📖 Words',cells:'🔬 Cell Jobs',stem:'🌱 Stem Cells'};
const state = {i:0,score:0,res:[],order:[],sort:{},locked:false,skill:{}};
const app = $('#app');

/* ---------- Screens ---------- */
function intro(){
  app.innerHTML = `
  <section class="card">
    <h1>Cell Specialists 🔬</h1>
    <div class="badge-free">✅ This quiz is NOT graded. It is NOT recorded. It does NOT affect your mark. It is just for practice!</div>
    <div class="chat">
      <div class="bubble"><span class="who" aria-hidden="true">🐑</span><p><b>Sheep:</b> Salaam! Your body has hundreds of kinds of cells, and each one has a special job. Today we practise <b>specialized cells</b> and <b>stem cells</b>. There are 20 questions.</p></div>
      <div class="bubble rab"><span class="who" aria-hidden="true">🐰</span><p><b>Rabbit:</b> So all my cells came from ONE cell? How did they all get different jobs? 🤔 Let's find out!</p></div>
    </div>
    <ul class="types" aria-label="Question types">
      <li>📖 Word → Meaning</li><li>🔤 Meaning → Word</li><li>🔎 Word Detective</li><li>🔬 Pick the Picture</li><li>🗂️ Sort It</li><li>✅ True or False</li><li>🔢 Put in Order</li><li>➗ Cell Math</li><li>⚖️ Ethics Talk</li>
    </ul>
    <p class="hint">Tip: on a computer you can press keys 1–4 to answer and Enter for the next question.</p>
    <div class="row"><button class="btn" id="start">Start ▶</button></div>
  </section>`;
  $('#start').onclick = ()=>{reset();show()};
  $('#start').focus();
}
function reset(){state.i=0;state.score=0;state.res=[];state.skill={};Object.keys(SKILLS).forEach(k=>state.skill[k]=[0,0])}

function header(){
  const d = Q.map((_,k)=>`<span class="${state.res[k]===true?'ok':state.res[k]===false?'no':k===state.i?'now':''}"></span>`).join('');
  return `<div class="top"><span>Question <b>${state.i+1}</b> of ${Q.length}</span><span>Score: <b>${state.score}</b></span></div><div class="dots" aria-hidden="true">${d}</div>`;
}

function show(){
  state.locked=false;
  const q = Q[state.i];
  let body = '';
  if(q.term){const w=W[q.term];body+=`<div class="term"><span class="en">${w[0]}</span><span class="say">🔊 ${w[1]}</span></div>`}
  if(q.fig) body+=`<div class="fig">${cell(q.fig,q.arrow)}</div>`;

  if(q.type==='mc'||q.type==='tf'){
    const order = q.type==='tf'?q.opts.map((o,k)=>k):shuffle(q.opts.map((o,k)=>k));
    body += `<div class="opts${q.type==='tf'?' tf':''}">${order.map((k,n)=>{const o=q.opts[k];const inner=typeof o==='string'?`<span class="main">${o}</span>`:wordHTML(o.w);return `<button class="opt" data-k="${k}">${q.type==='tf'?'':`<span class="k">${LET[n]}</span>`}<span class="body">${inner}</span><span class="mark"></span></button>`}).join('')}</div>`;
  } else if(q.type==='pic'){
    const order = shuffle(q.pics.map((p,k)=>k));
    body += `<div class="pics">${order.map((k,n)=>`<button class="opt pic" data-k="${k}" aria-label="Picture ${LET[n]}">${cell(q.pics[k])}<span class="cap"><span class="k">${LET[n]}</span><span class="name" hidden>${W[q.pics[k]][0]}</span><span class="mark"></span></span></button>`).join('')}</div>`;
  } else if(q.type==='order'){
    state.order=[];
    const mix = shuffle(q.items);
    body += `<div class="slots">${q.items.map((_,n)=>`<button class="slot" data-n="${n}" aria-label="Place ${n+1}"><span class="num">${n===0&&q.ends?'1 · '+q.ends[0]:n===q.items.length-1&&q.ends?n+1+' · '+q.ends[1]:n+1}</span><span class="val hint">tap an answer below</span></button>`).join('')}</div>
      <div class="chips">${mix.map(k=>`<button class="chip" data-w="${k}">${W[k][0]}</button>`).join('')}</div>
      <p class="hint">Tap a filled box to take the answer back.</p>
      <div class="row"><button class="btn" id="check" disabled>Check my order</button></div>`;
  } else if(q.type==='sort'){
    state.sort={};
    body += `<div class="sort">${q.items.map((it,n)=>`<div class="srow" data-n="${n}"><div class="lab"><b>${W[it.w][0]}</b><span class="say">🔊 ${W[it.w][1]}</span></div><div class="seg" style="grid-template-columns:repeat(${q.cats.length},minmax(0,1fr))" role="group" aria-label="${W[it.w][0]}">${q.cats.map((c,ci)=>`<button data-n="${n}" data-c="${ci}" aria-pressed="false">${c}</button>`).join('')}</div></div>`).join('')}</div>
      <div class="row"><button class="btn" id="check" disabled>Check my answers</button></div>`;
  }

  app.innerHTML = `${header()}<section class="card" aria-live="polite"><span class="tag">${q.tag}</span><p class="qtext">${q.q}</p>${body}<div id="fb"></div></section>`;

  if(q.type==='mc'||q.type==='tf'||q.type==='pic') app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(q.type==='order') wireOrder(q);
  if(q.type==='sort') wireSort(q);
  window.scrollTo({top:0});
}

function wireOrder(q){
  const render=()=>{
    app.querySelectorAll('.slot').forEach((s,n)=>{const k=state.order[n];s.classList.toggle('filled',!!k);s.querySelector('.val').outerHTML = k?`<span class="val"><b>${W[k][0]}</b></span>`:`<span class="val hint">tap an answer below</span>`});
    app.querySelectorAll('.chip').forEach(c=>c.hidden=state.order.includes(c.dataset.w));
    $('#check').disabled = state.order.length!==q.items.length;
  };
  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(state.locked)return;state.order.push(c.dataset.w);render()});
  app.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{if(state.locked)return;const n=+s.dataset.n;if(n<state.order.length){state.order.splice(n,1);render()}});
  $('#check').onclick=()=>{
    state.locked=true;
    let ok=true;
    app.querySelectorAll('.slot').forEach((s,n)=>{const r=state.order[n]===q.items[n];if(!r)ok=false;s.classList.add(r?'right':'wrong');s.insertAdjacentHTML('beforeend',`<span class="mark" style="margin-left:auto">${r?'✅':'❌'}</span>`)});
    $('#check').remove();
    finish(ok);
  };
}

function wireSort(q){
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    if(state.locked) return;
    const n=+b.dataset.n, c=+b.dataset.c; state.sort[n]=c;
    b.parentElement.querySelectorAll('button').forEach(x=>{const on=+x.dataset.c===c;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});
    $('#check').disabled = Object.keys(state.sort).length!==q.items.length;
  });
  $('#check').onclick=()=>{
    state.locked=true; let ok=true;
    app.querySelectorAll('.srow').forEach((r,n)=>{
      const right = state.sort[n]===q.items[n].c; if(!right) ok=false;
      r.classList.add(right?'right':'wrong');
      r.querySelectorAll('button').forEach(x=>x.disabled=true);
      r.querySelector('.lab').insertAdjacentHTML('beforeend', right?`<span class="mark">✅</span>`:`<span class="fix">❌ Answer: ${q.cats[q.items[n].c]}</span>`);
    });
    $('#check').remove();
    finish(ok);
  };
}

function answer(k){
  if(state.locked) return; state.locked=true;
  const q=Q[state.i]; const ok = k===q.a;
  app.querySelectorAll('.opt').forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.a){b.classList.add('right');b.querySelector('.mark').textContent='✅'}
    else if(bk===k){b.classList.add('wrong');b.querySelector('.mark').textContent='❌'}
    else b.classList.add('dim');
    const nm=b.querySelector('.name'); if(nm) nm.hidden=false;
  });
  finish(ok);
}

function correctText(q){
  if(q.type==='order') return q.items.map(k=>W[k][0]).join(' → ');
  if(q.type==='pic') return W[q.pics[q.a]][0];
  if(q.type==='sort') return q.items.map(it=>`${W[it.w][0]}: ${q.cats[it.c]}`).join(' · ');
  const o=q.opts[q.a]; return typeof o==='string'?o:W[o.w][0];
}

function finish(ok){
  const q=Q[state.i];
  state.res[state.i]=ok; if(ok) state.score++;
  state.skill[q.skill][1]++; if(ok) state.skill[q.skill][0]++;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const last = state.i===Q.length-1;
  $('#fb').innerHTML = `<div class="fb ${ok?'ok':'no'}">
    <p class="verdict">${ok?pick(PRAISE):'Not quite ❌'}</p>
    ${ok?'':`<div class="bubble rab"><span class="who" aria-hidden="true">🐰</span><p><b>Rabbit:</b> ${pick(OOPS)}</p></div><p><b>Correct answer:</b> ${correctText(q)}</p>`}
    <div class="bubble"><span class="who" aria-hidden="true">🐑</span><div class="ex"><p><b>Sheep explains:</b></p>${q.ex}</div></div>
    <p class="src">📚 From: ${q.src}</p>
    <div class="next-row"><button class="btn" id="next">${last?'See my score 🎉':'Next ▶'}</button></div>
  </div>`;
  app.querySelector('.top span:last-child b').textContent = state.score;
  const d=app.querySelectorAll('.dots span')[state.i]; d.className = ok?'ok':'no';
  $('#next').onclick=()=>{ if(last) results(); else {state.i++;show()} };
  $('#next').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}

function results(){
  const s=state.score, n=Q.length;
  const stars = s>=18?'⭐⭐⭐':s>=13?'⭐⭐☆':s>=8?'⭐☆☆':'☆☆☆';
  const msg = s>=18?'Excellent! You really know your cell words. 🏆':s>=13?'Great work! Look at the questions below to make it even better. 💪':s>=8?'Good start! Read the explanations below and try again. 🌱':'These are hard new words. Read the explanations below and try again. You can do it! 💙';
  const sk=k=>`<div class="skill"><b>${state.skill[k][0]}/${state.skill[k][1]}</b><span>${SKILLS[k]}</span></div>`;
  const missed = Q.map((q,k)=>({q,k})).filter(o=>state.res[o.k]===false);
  app.innerHTML = `<section class="card" style="align-items:center;text-align:center">
    <h2>Well done, cell specialist!</h2>
    <div class="score">${s}/${n}</div>
    <div class="stars" aria-label="${stars.split('⭐').length-1} stars">${stars}</div>
    <div class="bubble" style="text-align:left"><span class="who" aria-hidden="true">🐑</span><p><b>Sheep:</b> ${msg}</p></div>
    <div class="skills" style="width:100%">${Object.keys(SKILLS).map(sk).join('')}</div>
    <div class="badge-free" style="width:100%">✅ Remember: this is NOT graded, NOT recorded, and does NOT affect your mark.</div>
  </section>
  ${missed.length?`<section class="card"><h2>Look at these again 👀</h2>${missed.map(({q,k})=>`<details><summary>Q${k+1}. ${q.tag}: ${correctText(q)}</summary><div class="ex"><p class="hint">${q.q}</p>${q.ex}</div></details>`).join('')}</section>`:`<section class="card"><p>🐰 <b>Rabbit:</b> ${n} out of ${n}! Wow! Can you teach me? 😄</p></section>`}
  <div class="row" style="justify-content:center"><button class="btn" id="again">Try again 🔁</button></div>`;
  $('#again').onclick=()=>{reset();show()};
  if(s>=8) confetti(s>=18?260:140);
  window.scrollTo({top:0});
}

/* ---------- Confetti (no internet needed) ---------- */
function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#confetti'); cv.hidden=false; const cx=cv.getContext('2d');
  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--main','--gold','--good','--rbc','--nuc-line'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){cx.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
    if(++t<260) requestAnimationFrame(f); else {cx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})();
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  const n=['1','2','3','4'].indexOf(e.key)>-1?+e.key-1:['a','b','c','d'].indexOf(e.key.toLowerCase());
  const opts=app.querySelectorAll('.opt');
  if(n>-1 && opts[n] && !state.locked){opts[n].click();return}
  if((e.key==='Enter'||e.key==='ArrowRight') && $('#next')){e.preventDefault();$('#next').click()}
});

intro();

</script>
